<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="판독기" />
    <title>홈</title>
    <script>
      // 예전 주소(/#종목, /#/board, /#/briefing)로 들어오면 판독기로 바로 보내요
      if (location.hash.length > 1) location.replace("/reader.html" + location.search + location.hash);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f4f6;
        --card: #ffffff;
        --fill: #f2f4f6;
        --ink: #191f28;
        --ink-2: #4e5968;
        --ink-3: #8b95a1;
        --line: #eef0f2;
        --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #17171c;
          --card: #202027;
          --fill: #2c2c35;
          --ink: #ececef;
          --ink-2: #b0b8c1;
          --ink-3: #7e8590;
          --line: #2c2c35;
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
        word-break: keep-all;
        padding: 0 16px calc(32px + env(safe-area-inset-bottom));
      }
      .wrap { max-width: 640px; margin: 0 auto; }
      header { padding: calc(22px + env(safe-area-inset-top)) 4px 6px; }
      header p { margin: 0; font-size: 14px; color: var(--ink-3); font-weight: 600; }
      header h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; }
      .card { background: var(--card); border-radius: 22px; padding: 20px; margin-top: 14px; }
      .card h2 { margin: 0 0 4px; font-size: 15px; color: var(--ink-3); font-weight: 600; }
      .apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px; margin-top: 12px; }
      .app { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 600; text-align: center; }
      .app svg { border-radius: 16px; transition: transform 0.12s; }
      .app:active svg { transform: scale(0.94); }
      .list { list-style: none; margin: 8px 0 0; padding: 0; }
      .list a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; color: var(--ink); text-decoration: none; border-top: 1px solid var(--line); }
      .list li:first-child a { border-top: 0; }
      .list b { font-weight: 700; }
      .list small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 400; }
      .list .go { color: var(--ink-3); font-size: 22px; line-height: 1; }
      @media (prefers-reduced-motion: reduce) { .app svg { transition: none; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <p id="today"></p>
        <h1>노아님, 오늘은 무엇을 볼까요?</h1>
      </header>

      <section class="card" aria-labelledby="apps-title">
        <h2 id="apps-title">내 앱</h2>
        <nav class="apps">
          <a class="app" href="/reader.html"><svg width="56" height="56" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C97FF"/><stop offset="1" stop-color="#2272EB"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg1)"/><g transform="translate(32 33) scale(0.84) translate(-32 -33)"><g>
<circle cx="24" cy="15.5" r="6.8" fill="#fff"/><circle cx="32" cy="12" r="7.6" fill="#fff"/><circle cx="40" cy="15.5" r="6.8" fill="#fff"/>
<path d="M21.5 18 H42.5 L41 22 H23 Z" fill="#fff"/>
<path d="M23 21.5 H41 L40 34 H24 Z" fill="#fff"/>
<path d="M22.5 21.6 H41.5" stroke="#2B7BF3" stroke-width="1.6" stroke-linecap="round"/>
<path d="M28 24.5 V31.5 M32 24.5 V31.5 M36 24.5 V31.5" stroke="#2B7BF3" stroke-width="1.8" stroke-linecap="round"/>
</g>
<rect x="16" y="45" width="8" height="8" rx="2" fill="#fff" fill-opacity=".6"/>
<rect x="28" y="41" width="8" height="12" rx="2" fill="#fff" fill-opacity=".8"/>
<rect x="40" y="37" width="8" height="16" rx="2" fill="#fff"/></g></svg><span>판독기</span></a>
          <a class="app" href="/travel.html"><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#F2541C"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg2)"/><path d="M19 24h26l-2.6 22.2a3 3 0 0 1-3 2.6H24.6a3 3 0 0 1-3-2.6Z" fill="#fff"/><path d="M25.5 24v-2.5a6.5 6.5 0 0 1 13 0V24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="32" cy="36" r="5" fill="#F2541C"/><path d="M32 33.4v5.2M29.4 36h5.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><span>여행 쇼핑</span></a>
        </nav>
      </section>

      <section class="card" aria-labelledby="quick-title">
        <h2 id="quick-title">바로가기</h2>
        <ul class="list">
          <li><a href="/reader.html#/briefing"><span><b>아침 시장 브리핑</b><small>어제 미국·한국 장을 한눈에 봐요</small></span><span class="go" aria-hidden="true">›</span></a></li>
          <li><a href="/reader.html#/board"><span><b>판독표</b><small>조회한 종목을 여덟 판독자 점수로 비교해요</small></span><span class="go" aria-hidden="true">›</span></a></li>
          <li><a href="/travel.html"><span><b>일본 쇼핑 리스트</b><small>가서 사면 실제로 이득인 것부터 봐요</small></span><span class="go" aria-hidden="true">›</span></a></li>
        </ul>
      </section>
    </div>
    <script>
      const d = new Date();
      document.getElementById("today").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    </script>
  </body>
</html>
