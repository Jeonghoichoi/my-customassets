<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="판독기" />
    <title>저점 판독기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f4f6;
        --card: #ffffff;
        --fill: #f2f4f6;
        --fill-2: #e5e8eb;
        --ink: #191f28;
        --ink-2: #4e5968;
        --ink-3: #8b95a1;
        --line: #eef0f2;
        --primary: #3182f6;
        --primary-soft: #e8f3ff;
        --up: #f04452;
        --down: #3182f6;
        --good: #12a66d;
        --good-soft: #e3f6ee;
        --mid: #6b7684;
        --mid-soft: #f2f4f6;
        --warn: #f2711c;
        --warn-soft: #fff1e6;
        --shadow: 0 8px 28px rgba(0, 27, 55, 0.12);
        --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #17171c;
          --card: #202027;
          --fill: #2c2c35;
          --fill-2: #3a3a45;
          --ink: #ececef;
          --ink-2: #b0b8c1;
          --ink-3: #7e8590;
          --line: #2c2c35;
          --primary: #4593fc;
          --primary-soft: #1b2a40;
          --up: #f45a69;
          --down: #4593fc;
          --good: #2fc28a;
          --good-soft: #15302a;
          --mid: #9aa3ad;
          --mid-soft: #2c2c35;
          --warn: #ff8a3d;
          --warn-soft: #3a2615;
          --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
        padding-bottom: env(safe-area-inset-bottom);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .num,
      .big,
      .price strong,
      .score,
      .tile strong {
        font-variant-numeric: tabular-nums;
      }

      /* ---------- 상단 ---------- */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: saturate(1.6) blur(14px);
        -webkit-backdrop-filter: saturate(1.6) blur(14px);
        padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
      }
      .top > * {
        max-width: 1048px;
        margin-left: auto;
        margin-right: auto;
      }
      .brand {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }
      .brand span {
        font-size: 12px;
        color: var(--ink-3);
      }
      form {
        display: flex;
        gap: 8px;
      }
      .ac {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
      }
      .ac input {
        width: 100%;
      }
      input {
        flex: 1;
        min-width: 0;
        font: 500 16px var(--sans);
        padding: 0 16px;
        height: 50px;
        border: 0;
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
      }
      input::placeholder {
        font-weight: 400;
        color: var(--ink-3);
      }
      button {
        font: 600 15px var(--sans);
        border-radius: 14px;
        border: 0;
        padding: 0 20px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        min-height: 50px;
        transition: transform 0.1s ease, filter 0.15s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .ac-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 20;
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .ac-tabs {
        display: flex;
        gap: 6px;
        padding: 12px 12px 6px;
      }
      .ac-tabs button {
        min-height: 32px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        background: var(--fill);
        color: var(--ink-2);
        border-radius: 999px;
      }
      .ac-tabs button[aria-selected="true"] {
        background: var(--ink);
        color: var(--card);
      }
      #ac-list {
        list-style: none;
        margin: 0;
        padding: 4px 6px 8px;
        max-height: min(60vh, 380px);
        overflow-y: auto;
      }
      #ac-list li {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 12px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
      }
      #ac-list li[aria-selected="true"],
      #ac-list li:hover {
        background: var(--fill);
      }
      #ac-list .mk {
        grid-row: span 2;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        text-align: center;
        min-width: 46px;
      }
      #ac-list .mk.US {
        background: var(--primary-soft);
        color: var(--primary);
      }
      #ac-list .mk.KR {
        background: var(--good-soft);
        color: var(--good);
      }
      #ac-list .nm {
        font-weight: 600;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ac-list .nm mark {
        background: none;
        color: var(--primary);
      }
      #ac-list .sb {
        font-size: 12px;
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ac-list .empty-row {
        display: block;
        color: var(--ink-3);
        font-size: 13px;
        cursor: default;
      }
      #ac-list .empty-row:hover {
        background: none;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-top: 10px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chips button {
        min-height: 34px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 500;
        background: var(--card);
        color: var(--ink-2);
        border-radius: 999px;
        flex: none;
      }
      .demo {
        max-width: 1048px;
        margin: 4px auto 0;
        margin-inline: max(16px, calc((100% - 1048px) / 2));
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--primary-soft);
        color: var(--ink-2);
        font-size: 13px;
      }

      /* ---------- 레이아웃 ---------- */
      main {
        padding: 12px 16px 40px;
        display: grid;
        gap: 12px;
        max-width: 1080px;
        margin: 0 auto;
      }
      .col {
        display: grid;
        gap: 12px;
        min-width: 0;
        align-content: start;
      }
      @media (min-width: 900px) {
        main {
          grid-template-columns: 420px 1fr;
          align-items: start;
          gap: 16px;
        }
        .col {
          gap: 16px;
        }
      }
      .card {
        background: var(--card);
        border-radius: 22px;
        padding: 24px 20px;
        min-width: 0;
      }
      .card[hidden] {
        display: none;
      }
      .eyebrow {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
      }
      h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.4;
      }
      h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }
      .sub {
        color: var(--ink-3);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .big {
        display: block;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        margin: 2px 0 0;
      }
      .lead {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink);
      }
      .callout {
        margin: 16px 0 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.6;
      }
      .callout b {
        display: block;
        color: var(--ink);
        font-size: 13px;
        margin-bottom: 2px;
      }
      .foot {
        margin: 16px 4px 0;
        font-size: 12px;
        color: var(--ink-3);
        line-height: 1.6;
      }
      .empty {
        color: var(--ink-3);
        text-align: center;
        padding: 28px 8px;
        margin: 0;
        font-size: 15px;
      }
      .error {
        color: var(--up);
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }

      /* 상태 칩: 우호(초록) · 중립(회색) · 경계(주황) */
      .chip {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
        background: var(--mid-soft);
        color: var(--mid);
      }
      .chip.on {
        background: var(--good-soft);
        color: var(--good);
      }
      .chip.off {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.blue {
        background: var(--primary-soft);
        color: var(--primary);
      }

      /* 펼치기 */
      details > summary {
        list-style: none;
        cursor: pointer;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      .more {
        margin-top: 16px;
        border-top: 1px solid var(--line);
      }
      .more > summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 2px 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .more > summary::after,
      .row > summary .val::after {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--ink-3);
        border-bottom: 2px solid var(--ink-3);
        transform: rotate(45deg) translateY(-3px);
        transition: transform 0.2s ease;
        flex: none;
      }
      .more[open] > summary::after,
      .row[open] > summary .val::after {
        transform: rotate(-135deg) translateY(-1px);
      }
      .more > .body {
        padding-top: 12px;
      }

      /* ⓘ 툴팁 버튼 */
      .tip {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        min-height: 0;
        padding: 0;
        margin-left: 4px;
        border-radius: 50%;
        background: var(--fill-2);
        color: var(--ink-2);
        font: 700 11px/1 var(--sans);
        vertical-align: 1px;
        flex: none;
        position: relative;
      }
      .tip::before {
        content: "";
        position: absolute;
        inset: -12px;
      }

      /* 바텀시트 */
      .sheet-bg {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        z-index: 51;
        width: min(100%, 480px);
        background: var(--card);
        border-radius: 24px 24px 0 0;
        padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
        transform: translate(-50%, 105%);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-height: 80vh;
        overflow-y: auto;
      }
      .sheet::before {
        content: "";
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: var(--fill-2);
        margin: 0 auto 18px;
      }
      body.sheet-open .sheet-bg {
        opacity: 1;
        pointer-events: auto;
      }
      body.sheet-open .sheet {
        transform: translate(-50%, 0);
      }
      .sheet h3 {
        font-size: 20px;
      }
      .sheet p {
        margin: 10px 0 0;
        color: var(--ink-2);
        line-height: 1.7;
      }
      .sheet .now {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        font-size: 14px;
      }
      .sheet .now b {
        display: block;
        font-size: 12px;
        color: var(--ink-3);
        margin-bottom: 2px;
      }
      .sheet button {
        width: 100%;
        margin-top: 20px;
      }

      /* ---------- 다이얼 ---------- */
      .dial {
        width: 100%;
        max-width: 260px;
        display: block;
        margin: 18px auto 0;
      }
      .dial .arc-off {
        stroke: var(--warn);
      }
      .dial .arc-neutral {
        stroke: var(--fill-2);
      }
      .dial .arc-on {
        stroke: var(--good);
      }
      .dial .tick {
        font: 500 12px var(--sans);
        fill: var(--ink-3);
      }
      .dial .needle {
        stroke: var(--ink);
        stroke-width: 4;
        stroke-linecap: round;
        transform-origin: 160px 150px;
        transition: transform 0.9s cubic-bezier(0.3, 1.3, 0.5, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .dial .needle {
          transition: none;
        }
      }
      .dial .hub {
        fill: var(--ink);
      }
      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .hero .score {
        font-size: 15px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .tone-on {
        background: var(--good-soft);
        color: var(--good);
      }
      .tone-mid {
        background: var(--mid-soft);
        color: var(--mid);
      }
      .tone-off {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* ---------- 목록 행 ---------- */
      .rows {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
      }
      .rows > li + li {
        border-top: 1px solid var(--line);
      }
      .row > summary,
      .row-static {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 0;
        min-height: 52px;
      }
      .row .name {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        display: flex;
        align-items: center;
      }
      .row .val {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--ink-2);
        text-align: right;
      }
      .row .detail {
        margin: 0 0 14px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        font-size: 14px;
        color: var(--ink-2);
        line-height: 1.65;
      }
      .row .detail a {
        color: var(--primary);
        text-decoration: none;
        font-size: 13px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--mid);
      }
      .dot.on {
        background: var(--good);
      }
      .dot.off {
        background: var(--warn);
      }
      .tally {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      /* ---------- 숫자 타일 ---------- */
      .tiles3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }
      .tile {
        background: var(--fill);
        border-radius: 14px;
        padding: 12px;
        min-width: 0;
      }
      .tile small {
        display: flex;
        align-items: center;
        font-size: 12px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .tile strong {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------- 원자재 ---------- */
      .cmd-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }
      .cmd {
        background: var(--fill);
        border-radius: 16px;
        padding: 14px;
        min-width: 0;
      }
      .cmd small {
        color: var(--ink-3);
        font-size: 12px;
      }
      .cmd b {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .cmd strong {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .cmd .chg {
        font-size: 13px;
        font-weight: 600;
      }
      .cmd svg {
        display: block;
        width: 100%;
        height: 28px;
        margin-top: 8px;
      }
      .cmd svg path {
        fill: none;
        stroke-width: 1.6;
      }
      .cmd svg.up path {
        stroke: var(--up);
      }
      .cmd svg.down path {
        stroke: var(--down);
      }
      .defs {
        margin: 0;
        display: grid;
        gap: 12px;
      }
      .defs dt {
        font-weight: 600;
        font-size: 14px;
      }
      .defs dd {
        margin: 2px 0 0;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ---------- 종목 ---------- */
      .stock-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .stock-head h2 {
        font-size: 22px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .badge.US {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge.KR {
        background: var(--good-soft);
        color: var(--good);
      }
      .price {
        margin-top: 16px;
      }
      .price strong {
        display: block;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
      }
      .price span {
        font-size: 15px;
        font-weight: 600;
      }
      .spark {
        width: 100%;
        height: 96px;
        display: block;
        margin-top: 20px;
      }
      .spark .line {
        fill: none;
        stroke-width: 2;
      }
      .spark.up .line {
        stroke: var(--up);
      }
      .spark.down .line {
        stroke: var(--down);
      }
      .spark .hi {
        stroke: var(--ink-3);
        stroke-dasharray: 3 4;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .spark-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 4px;
      }
      .note-kr {
        margin: 14px 0 0;
        font-size: 13px;
        color: var(--ink-2);
        background: var(--fill);
        border-radius: 12px;
        padding: 10px 14px;
      }
      .meter {
        position: relative;
        height: 8px;
        border-radius: 4px;
        background: var(--fill);
        margin: 0 0 16px;
        overflow: visible;
      }
      .meter .zl,
      .meter .zh {
        position: absolute;
        top: 0;
        bottom: 0;
      }
      .meter .zl {
        left: 0;
        background: var(--good-soft);
        border-radius: 4px 0 0 4px;
      }
      .meter .zh {
        right: 0;
        background: var(--warn-soft);
        border-radius: 0 4px 4px 0;
      }
      .meter .pin {
        position: absolute;
        top: -4px;
        width: 4px;
        height: 16px;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--ink);
      }
      .meter .pin.d {
        background: var(--ink-3);
      }

      /* 일곱 투자자 */
      .judges-sum {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
        margin-top: 16px;
      }
      .judges-sum a {
        text-decoration: none;
        color: inherit;
        text-align: center;
        padding: 10px 0 8px;
        border-radius: 12px;
        background: var(--fill);
      }
      .judges-sum small {
        display: block;
        font-size: 11px;
        color: var(--ink-3);

    <div class="sheet-bg" id="sheet-bg"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (v) =>
        String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v) ? "–" : v.toFixed(d));
      const signed = (v, d = 1, unit = "%") => (v === null || v === undefined || Number.isNaN(v) ? "–" : `${v >= 0 ? "+" : ""}${v.toFixed(d)}${unit}`);
      const updown = (v) => (v === null || v === undefined ? "" : v > 0 ? "up" : v < 0 ? "down" : "");
      const statusColor = (g) => (g === null ? "var(--fill-2)" : g >= 1 ? "var(--good)" : g > 0 ? "var(--mid)" : "var(--warn)");
      const scoreTone = (s) => (s >= 65 ? "on" : s >= 45 ? "mid" : "off");
      const toneColor = { on: "var(--good)", mid: "var(--mid)", off: "var(--warn)" };
      // 받침에 맞춰 은/는
      const withTopic = (w) => {
        const c = w.charCodeAt(w.length - 1) - 0xac00;
        return w + (c >= 0 && c < 11172 && c % 28 ? "은" : "는");
      };
      const STATUS_TEXT ={ on: "바닥 쪽", neutral: "중립", off: "과열 쪽" };
      let config = { ai: false };

      // ---------- 어려운 지표 쉬운 설명 (ⓘ 버튼) ----------
      const TERMS = {
        PER: ["PER (주가수익비율)", "주가가 1년 이익의 몇 배인지 보여줘요. 낮을수록 이익에 비해 싸게 거래되고 있다는 뜻이에요."],
        PBR: ["PBR (주가순자산비율)", "주가가 회사 순자산(자본)의 몇 배인지예요. 1보다 낮으면 장부상 가치보다 싸게 거래되는 셈이에요."],
        PSR: ["PSR (주가매출비율)", "시가총액이 1년 매출의 몇 배인지예요. 아직 이익이 적은 회사도 비교할 수 있어요."],
        PCR: ["PCR (주가현금흐름비율)", "주가가 영업으로 번 현금의 몇 배인지예요. 회계상 이익보다 속이기 어려운 지표예요."],
        PEG: ["PEG", "PER을 이익 성장률로 나눈 값이에요. 1 이하면 성장 속도에 비해 싸다고 봐요. 피터 린치가 즐겨 썼어요."],
        "배당 보정 PEG": ["배당 보정 PEG", "(이익 성장률 + 배당수익률)을 PER로 나눈 값이에요. 2 이상이면 매력적, 1 미만이면 비싸다고 봐요."],
        ROE: ["ROE (자기자본이익률)", "주주가 맡긴 돈으로 1년에 몇 %를 버는지예요. 꾸준히 15~20% 넘으면 경쟁력이 강한 회사일 가능성이 커요."],
        ROIC: ["ROIC (투하자본이익률)", "빌린 돈까지 포함해 사업에 넣은 돈으로 얼마나 버는지예요. 높을수록 남들이 따라 하기 어려운 사업이에요."],
        FCF: ["FCF 수익률", "회사가 실제로 손에 쥔 현금(잉여현금흐름)이 시가총액의 몇 %인지예요. 높을수록 현금을 잘 버는데 싸다는 뜻이에요."],
        "EV/EBITDA": ["EV/EBITDA", "빚까지 포함한 회사 몸값이 영업으로 버는 돈의 몇 배인지예요. 회사를 통째로 사면 몇 년 만에 본전인지에 가까워요."],
        배당수익률: ["배당수익률", "주가 대비 1년 배당금 비율이에요. 3%면 100만 원어치 사면 1년에 3만 원을 받아요."],
        부채: ["부채비율", "자본 대비 빚이 얼마나 되는지예요. 낮을수록 불황이 와도 버틸 힘이 있어요."],
        EPS: ["EPS 성장률", "주식 1주당 이익이 1년 새 얼마나 늘었는지예요."],
        매출총이익률: ["매출총이익률", "매출에서 원가를 빼고 남는 비율이에요. 높으면 값을 올려도 손님이 떠나지 않는 가격 결정력이 있다는 뜻이에요."],
        순이익률: ["순이익률", "매출 중 최종적으로 남는 이익의 비율이에요. 얇으면 작은 충격에도 적자가 날 수 있어요."],
        희석: ["주주 지분 희석", "회사가 새 주식을 많이 찍으면 기존 주주의 몫이 줄어요. 주식 수가 늘었는지 보는 항목이에요."],
        이익수익률: ["이익수익률", "PER을 뒤집은 값(1÷PER)이에요. 주식을 채권처럼 봤을 때의 수익률이라, 국채 금리와 바로 비교할 수 있어요."],
        "미스터 마켓": ["미스터 마켓의 할인", "버핏의 스승 그레이엄의 비유예요. 시장은 기분파라 가끔 좋은 회사를 이유 없이 싸게 내놓아요."],
        할인: ["일시적 할인", "좋은 회사가 일시적인 악재로 고점보다 많이 빠져 있는지 봐요."],
        RSI: ["RSI (상대강도지수)", "최근 14일 동안 오른 힘과 내린 힘을 비교한 값이에요. 30 아래면 너무 많이 팔린 과매도, 70 위면 과매수예요."],
        스토캐스틱: ["스토캐스틱", "최근 14일 가격 범위에서 오늘 종가가 어디쯤인지 보여줘요. 20 아래 과매도, 80 위 과매수예요. %K가 %D를 위로 뚫으면 반등 신호로 봐요."],
        "%R": ["윌리엄스 %R", "래리 윌리엄스가 만든 지표예요. 최근 14일 범위에서 종가 위치를 보고, -80 아래면 과매도, -20 위면 과매수예요."],
        "200일선": ["200일 이동평균선", "최근 200거래일 종가의 평균이에요. 주가가 이 선 위에 있으면 장기 추세가 살아 있다고 봐요."],
        "1년 고점": ["1년 고점 대비", "최근 1년 중 가장 높았던 가격에서 지금 얼마나 내려와 있는지예요."],
        "상대 강도": ["상대 강도", "최근 12개월 주가 상승률이에요. 시장이 이미 알아보기 시작했는지 보는 항목이에요."],
        "신용 스프레드": ["신용 스프레드", "회사채 금리에서 국채 금리를 뺀 값이에요. 벌어지면 시장이 불안하다는 뜻이고, 좁혀지면 안도하고 있다는 뜻이에요."],
        신용시장: ["신용시장", "회사채 위험 프리미엄(신용 스프레드)이 넓은지 좁은지로 시장의 불안을 읽어요."],
        "장단기 금리차": ["장단기 금리차", "10년 국채 금리에서 2년 국채 금리를 뺀 값이에요. 마이너스(역전)면 경기 둔화 경고, 다시 벌어지면 회복 기대로 봐요."],
        "구리/금": ["구리/금 비율", "경기에 민감한 구리와 안전자산인 금의 가격 비율이에요. 오르면 성장 기대, 내리면 불안이 커진다는 뜻이에요."],
        통화정책: ["통화정책 (연준)", "미국 중앙은행이 금리를 올리는지 내리는지예요. 내리면 시장에 돈이 풀려 주가에 우호적이에요."],
        유동성: ["연준 유동성", "미국 중앙은행이 시장에 돈을 푸는지 거두는지예요. 주가를 크게 움직이는 힘이에요."],
        "채권 금리": ["채권 금리 (10년 국채)", "미국 10년 국채 금리예요. 고점을 찍고 꺾이면 주식 바닥에 앞서는 경우가 많았어요."],
        신용잔고: ["신용잔고 (빚투)", "빚을 내서 주식을 산 금액이에요. 너무 많으면 하락 때 강제 매도가 하락을 키우고, 크게 줄면 바닥 조건에 가까워요."],
        "투자 심리": ["투자 심리 (VIX)", "시장의 공포 지수예요. 높을수록 사람들이 겁먹고 있다는 뜻이고, 극단적인 공포는 바닥 근처에서 자주 나와요."],
        "4년 주기": ["4년 주기", "미국 대선을 기준으로 한 4년 주기예요. 중간선거 해 하반기에 저점이 자주 나왔어요."],
        계절성: ["계절성", "10월부터 이듬해 봄까지 강하고, 5~9월은 약했던 과거 패턴이에요."],
        "10년 패턴": ["10년 패턴", "연도 끝자리별 과거 수익률 패턴이에요. 끝자리 5·7·8년이 강했어요."],
        유가: ["유가 (WTI)", "미국 원유 가격이에요. 오르면 물가와 금리 부담이 커지고, 꺾이면 주식에 순풍이에요."],
        구리: ["구리", "공장·건설·전력망에 두루 쓰여서 경기를 먼저 알려준다고 '닥터 코퍼'라고 불려요."],
        금: ["금", "대표적인 안전자산이에요. 불안할 때나 달러 가치가 떨어질 때 올라요."],
        컨센서스: ["컨센서스", "이 종목을 분석하는 증권사 애널리스트들의 평균 의견이에요."],
        목표가: ["평균 목표가", "애널리스트들이 제시한 1년 뒤 예상 주가의 평균이에요. 자주 틀리고 주가를 뒤따라 바뀌어요."],
      };
      // 라벨 안에 이 단어가 있으면 해당 설명을 붙여요 (먼저 맞는 것 우선)
      const TERM_MATCH = [
        ["배당 보정 PEG", "배당 보정 PEG"], ["PEG", "PEG"], ["EV/EBITDA", "EV/EBITDA"], ["PCR", "PCR"], ["PSR", "PSR"], ["PBR", "PBR"],
        ["ROIC", "ROIC"], ["자본 효율", "ROIC"], ["ROE", "ROE"], ["FCF", "FCF"], ["현금을 못", "FCF"], ["이익수익률", "이익수익률"],
        ["PER", "PER"], ["기대가 너무 큰", "PER"], ["배당수익률", "배당수익률"], ["부채", "부채"], ["EPS", "EPS"], ["실적 모멘텀", "EPS"],
        ["매출총이익률", "매출총이익률"], ["순이익률", "순이익률"], ["얇은 이익", "순이익률"], ["희석", "희석"], ["미스터 마켓", "미스터 마켓"],
        ["일시적 할인", "할인"], ["RSI", "RSI"], ["스토캐스틱", "스토캐스틱"], ["%R", "%R"], ["200일", "200일선"], ["1년 고점", "1년 고점"],
        ["상대 강도", "상대 강도"], ["신용 스프레드", "신용 스프레드"], ["신용시장", "신용시장"], ["장단기", "장단기 금리차"],
        ["구리/금", "구리/금"], ["통화정책", "통화정책"], ["유동성", "유동성"], ["채권 금리", "채권 금리"], ["신용잔고", "신용잔고"],
        ["투자 심리", "투자 심리"], ["4년 주기", "4년 주기"], ["계절성", "계절성"], ["10년 패턴", "10년 패턴"], ["유가", "유가"],
        ["구리", "구리"], ["금 가격", "금"], ["컨센서스", "컨센서스"], ["목표가", "목표가"],
      ];
      const termKey = (label) => (TERM_MATCH.find(([w]) => String(label).includes(w)) || [])[1];
      // 라벨 옆 ⓘ 버튼. now는 '지금 이 종목에서는' 같은 구체 설명
      function tip(label, now) {
        const k = termKey(label);
        if (!k && !now) return "";
        return `<button type="button" class="tip" aria-label="${esc(label)} 설명 보기" data-k="${esc(k || "")}" data-l="${esc(
          label
        )}" data-now="${esc(now || "")}">i</button>`;
      }
      function openSheet(btn) {
        const t = TERMS[btn.dataset.k];
        $("#sheet-title").textContent = t ? t[0] : btn.dataset.l;
        $("#sheet-body").textContent = t ? t[1] : "";
        $("#sheet-body").hidden = !t;
        const now = btn.dataset.now;
        $("#sheet-now").hidden = !now;
        $("#sheet-now").innerHTML = now ? `<b>지금은</b>${esc(now)}` : "";
        document.body.classList.add("sheet-open");
        $("#sheet").setAttribute("aria-hidden", "false");
        $("#sheet-close").focus();
      }
      function closeSheet() {
        document.body.classList.remove("sheet-open");
        $("#sheet").setAttribute("aria-hidden", "true");
      }
      document.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest(".tip");
          if (!b) return;
          e.preventDefault();
          e.stopPropagation();
          openSheet(b);
        },
        true

      // 반원 다이얼: 왼쪽 과열, 오른쪽 저점. value는 -100(과열) ~ +100(저점)
      function dial(value, label) {
        const angle = Math.max(-90, Math.min(90, (value / 100) * 90));
        const arc = (a0, a1) => {
          const p = (a) => [160 + 120 * Math.cos(Math.PI - a), 150 - 120 * Math.sin(Math.PI - a)];
          const [x0, y0] = p(a0),
            [x1, y1] = p(a1);
          return `M${x0.toFixed(1)} ${y0.toFixed(1)} A120 120 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
        };
        const r = (deg) => (deg * Math.PI) / 180;
        return `
    <svg class="dial" viewBox="0 0 320 175" role="img" aria-label="판독 ${esc(label)}, ${value}점">
      <path d="${arc(r(2), r(58))}" class="arc-off" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="${arc(r(62), r(118))}" class="arc-neutral" stroke-width="12" fill="none"/>
      <path d="${arc(r(122), r(178))}" class="arc-on" stroke-width="12" fill="none" stroke-linecap="round"/>
      <text class="tick" x="26" y="172">과열</text>
      <text class="tick" x="160" y="14" text-anchor="middle">중립</text>
      <text class="tick" x="294" y="172" text-anchor="end">저점</text>
      <line class="needle" x1="160" y1="150" x2="160" y2="50" style="transform: rotate(-90deg)" data-angle="${angle}"/>
      <circle class="hub" cx="160" cy="150" r="7"/>
    </svg>`;
      }
      function settleNeedles(root) {
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            root.querySelectorAll(".needle").forEach((n) => {
              n.style.transform = `rotate(${n.dataset.angle}deg)`;
            });
          })
        );
      }
      const pointTone = (v) => (v >= 15 ? "on" : v > -15 ? "mid" : "off");

      async function api(path) {
        let code = "";
        try {
          code = localStorage.getItem("accessCode") || "";
        } catch {}
        const res = await fetch(path, { headers: code ? { "x-access-code": code } : {} });
        if (res.status === 401) {
          showGate();
          throw new Error("접근 코드가 필요해요.");
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `요청에 실패했어요 (${res.status})`);
        return data;
      }

      function sparkPath(vals, W, H, pad = 2) {
        const mn = Math.min(...vals),
          mx = Math.max(...vals);
        return vals
          .map((v, i) => `${i ? "L" : "M"}${((i / (vals.length - 1)) * W).toFixed(1)} ${(pad + (1 - (v - mn) / (mx - mn || 1)) * (H - pad * 2)).toFixed(1)}`)
          .join("");
      }

      function spark(history, high, currency) {
        const money = (v) => (currency === "KRW" ? Math.round(v).toLocaleString("ko-KR") + "원" : "$" + fmt(v, 2));
        const closes = history.map((p) => p[1]);
        const min = Math.min(...closes, high),
          max = Math.max(...closes, high);
        const W = 320,
          H = 96,
          pad = 4;
        const y = (v) => pad + (1 - (v - min) / (max - min || 1)) * (H - pad * 2);
        const d = closes.map((v, i) => `${i ? "L" : "M"}${((i / (closes.length - 1)) * W).toFixed(1)} ${y(v).toFixed(1)}`).join("");
        const dir = closes[closes.length - 1] >= closes[0] ? "up" : "down";
        return `<svg class="spark ${dir}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 1년 주가">
    <line class="hi" x1="0" x2="${W}" y1="${y(high)}" y2="${y(high)}"/>
    <path class="line" d="${d}" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="spark-labels"><span>1년 전</span><span>점선은 1년 고점 ${money(high)}</span></div>`;
      }

      // ---------- 자동완성 ----------

        .then((r) => r.json())

        .catch(() => {});
      const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
      const cho = (str) =>
        [...str]
          .map((ch) => {
            const c = ch.charCodeAt(0) - 0xac00;
            return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch;
          })
          .join("");
      const isCho = (q) => /^[ㄱ-ㅎ]+$/.test(q);
      const isKR = (x) => x.m !== "US";
      const marketText = (m) =>
        m === "US" ? "미국" : /KOSDAQ|코스닥/i.test(m) ? "코스닥" : /KOSPI|코스피/i.test(m) ? "코스피" : "국내";
      let acFilter = "all",
        acItems = [],
        acIndex = -1,
        acTimer = null,
        remoteTimer = null;

      function scoreOf(x, q) {
        const Q = q.toUpperCase(),
          name = x.n.toUpperCase(),
          alt = (x.k || "").toUpperCase(),
          sym = x.s.toUpperCase();
        if (sym === Q) return 100;
        if (sym.startsWith(Q)) return 85;
        if (name.startsWith(Q)) return 75;
        if (alt.split(/\s+/).some((w) => w.startsWith(Q))) return 65;
        if (name.includes(Q)) return 55;
        if (alt.includes(Q)) return 45;
        if (isCho(q) && (cho(x.n).includes(q) || cho(x.k || "").includes(q))) return 40;
        return 0;
      }
      function mark(text, q) {
        const i = text.toUpperCase().indexOf(q.toUpperCase());
        return i < 0 || isCho(q)
          ? esc(text)
          : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
      }
      function localMatches(q) {
        return STOCKS.map((x) => ({ x, sc: scoreOf(x, q) }))
          .filter((r) => r.sc > 0)
          .filter((r) => acFilter === "all" || (acFilter === "KR" ? isKR(r.x) : !isKR(r.x)))
          .sort((a, b) => b.sc - a.sc)
          .slice(0, 8)
          .map((r) => r.x);
      }
      function renderAc(q, items, loading) {
        acItems = items;
        acIndex = items.length ? 0 : -1;
        const list = $("#ac-list");
        list.innerHTML = items.length
          ? items
              .map(
                (x, i) => `<li role="option" id="ac-${i}" aria-selected="${i === 0}" data-i="${i}">
        <span class="mk ${isKR(x) ? "KR" : "US"}">${marketText(x.m)}</span>
        <span class="nm">${mark(x.n, q)}</span>
        <span class="sb">${esc(x.s)}${x.k ? " · " + mark(x.k, q) : ""}</span></li>`
              )
              .join("")
          : `<li class="empty-row">${
              loading ? "더 찾는 중…" : `'${esc(q)}'와 맞는 종목이 없어요. Enter로 그대로 검색할 수 있어요.`
            }</li>`;
        $("#ac-panel").hidden = false;
        $("#q").setAttribute("aria-expanded", "true");
      }
      function closeAc() {
        $("#ac-panel").hidden = true;
        $("#q").setAttribute("aria-expanded", "false");
        acIndex = -1;
      }
      function moveAc(d) {
        if (!acItems.length) return;
        acIndex = (acIndex + d + acItems.length) % acItems.length;
        [...$("#ac-list").children].forEach((li, i) => li.setAttribute("aria-selected", String(i === acIndex)));
        $("#q").setAttribute("aria-activedescendant", `ac-${acIndex}`);
        $(`#ac-${acIndex}`)?.scrollIntoView({ block: "nearest" });
      }
      function pick(x) {
        $("#q").value = x.n;
        closeAc();
        loadStock(x.s, true);
        $("#q").blur();
      }

      function runAc() {
        const q = $("#q").value.trim();
        if (!q) return closeAc();
        const local = localMatches(q);
        renderAc(q, local, false);
        clearTimeout(remoteTimer);
        // 목록에 적을 때만 서버 검색 (미국은 FMP 호출 한도를 쓰므로 아끼기)
        if (local.length >= 3 || config.demo || q.length < 2 || isCho(q)) return;
        remoteTimer = setTimeout(async () => {
          try {
            const r = await api(`/api/search/${encodeURIComponent(q)}`);
            if ($("#q").value.trim() !== q) return;
            const extra = (r.results || [])
              .map((x) => ({ s: x.s, n: x.n, k: "", m: x.kr ? x.m || "KR" : "US" }))
              .filter((x) => acFilter === "all" || (acFilter === "KR" ? isKR(x) : !isKR(x)))
              .filter((x) => !local.some((l) => l.s === x.s));
            renderAc(q, [...local, ...extra].slice(0, 10), false);
          } catch {}
        }, 450);
      }
      $("#q").addEventListener("input", () => {
        clearTimeout(acTimer);
        acTimer = setTimeout(runAc, 80);
      });
      $("#q").addEventListener("focus", () => {
        if ($("#q").value.trim()) runAc();
      });
      $("#q").addEventListener("keydown", (e) => {
        if ($("#ac-panel").hidden) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          moveAc(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          moveAc(-1);
        } else if (e.key === "Escape") closeAc();
        else if (e.key === "Enter" && acIndex >= 0 && acItems[acIndex]) {
          e.preventDefault();
          pick(acItems[acIndex]);
        }
      });
      $("#ac-list").addEventListener("mousedown", (e) => e.preventDefault());
      $("#ac-list").addEventListener("click", (e) => {
        const li = e.target.closest("li[data-i]");
        if (li) pick(acItems[Number(li.dataset.i)]);
      });
      document.querySelector(".ac-tabs").addEventListener("mousedown", (e) => e.preventDefault());
      document.querySelector(".ac-tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-f]");
        if (!b) return;
        acFilter = b.dataset.f;
        document.querySelectorAll(".ac-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
        runAc();
      });
      $("#q").addEventListener("blur", () => setTimeout(closeAc, 120));

      // 최근 검색은 이 기기에만 저장
      const DEFAULTS = ["VZ", "GOOGL", "JPM", "005930", "000660", "105560"];
      function recent() {
        try {
          return JSON.parse(localStorage.getItem("recent") || "[]");
        } catch {
          return [];
        }
      }
      function remember(sym) {
        const list = [sym, ...recent().filter((x) => x !== sym)].slice(0, 8);
        try {
          localStorage.setItem("recent", JSON.stringify(list));
        } catch {}
        renderChips();
      }
      function renderChips() {
        const list = config.demo ? config.demoSymbols : [...new Set([...recent(), ...DEFAULTS])].slice(0, 10);
        const label = (sym) =>
          STOCKS.find((x) => x.s === sym)?.m !== "US" && STOCKS.find((x) => x.s === sym)
            ? STOCKS.find((x) => x.s === sym).n
            : sym;
        $("#chips").innerHTML = list.map((s) => `<button type="button" data-s="${esc(s)}">${esc(label(s))}</button>`).join("");
      }
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) {
          $("#q").value = b.textContent;
          loadStock(b.dataset.s, true);
        }
      });
      $("#search").addEventListener("submit", (e) => {
        e.preventDefault();
        closeAc();
        loadStock($("#q").value, true);
        $("#q").blur();
      });

      function showGate() {
        if ($("#gate")) return;
        document.querySelector("main").innerHTML = `<section class="card gate" id="gate"><h2>접근 코드를 입력해 주세요</h2>
    <p class="sub">이 판독기는 코드가 있는 사람만 쓸 수 있어요.</p>
    <form id="gate-form"><input id="code" type="password" style="text-transform:none" aria-label="접근 코드"><button type="submit">확인</button></form></section>`;
        $("#gate-form").addEventListener("submit", (e) => {
          e.preventDefault();
          try {
            localStorage.setItem("accessCode", $("#code").value);
          } catch {}
          location.reload();
        });
      }

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

      (async () => {
        try {
          config = await api("/api/config");
        } catch {}
        if (config.needsCode) {
          let c = "";
          try {
            c = localStorage.getItem("accessCode") || "";
          } catch {}
          if (!c) return showGate();
        }
        if (config.demo) {
          $("#demo").hidden = false;
          $("#demo").textContent =
            "데모 모드예요. 재무 지표는 2026년 10월 말 공개값이고, 주가·금리 곡선은 가상 경로예요.";
        }
        renderChips();
        loadMarket();
        const start = decodeURIComponent(location.hash.slice(1));
        if (start) {
          $("#q").value = start;
          loadStock(start);
        }
      })();
    </script>
  </body>
</html>
