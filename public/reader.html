<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="판독기" />
    <title>판독기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f4f6;
        --card: #ffffff;
        --fill: #f2f4f6;
        --fill-2: #e5e8eb;
        --ink: #191f28;
        --ink-2: #4e5968;
        --ink-3: #8b95a1;
        --line: #eef0f2;
        --primary: #3182f6;
        --primary-soft: #e8f3ff;
        --up: #f04452;
        --down: #3182f6;
        --good: #12a66d;
        --good-soft: #e3f6ee;
        --mid: #6b7684;
        --mid-soft: #f2f4f6;
        --warn: #f2711c;
        --warn-soft: #fff1e6;
        --shadow: 0 8px 28px rgba(0, 27, 55, 0.12);
        /* 점수 5단계: 저점 쪽 초록 → 과열 쪽 빨강 */
        --s5: #0f9d63;
        --s4: #4fb36c;
        --s3: #c48f00;
        --s2: #f2711c;
        --s1: #e5383b;
        --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #17171c;
          --card: #202027;
          --fill: #2c2c35;
          --fill-2: #3a3a45;
          --ink: #ececef;
          --ink-2: #b0b8c1;
          --ink-3: #7e8590;
          --line: #2c2c35;
          --primary: #4593fc;
          --primary-soft: #1b2a40;
          --up: #f45a69;
          --down: #4593fc;
          --good: #2fc28a;
          --good-soft: #15302a;
          --mid: #9aa3ad;
          --mid-soft: #2c2c35;
          --warn: #ff8a3d;
          --warn-soft: #3a2615;
          --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
          --s5: #2fc28a;
          --s4: #7acb8c;
          --s3: #e2b341;
          --s2: #ff8a3d;
          --s1: #ff6b6e;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
        padding-bottom: env(safe-area-inset-bottom);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .num,
      .big,
      .price strong,
      .score,
      .tile strong {
        font-variant-numeric: tabular-nums;
      }

      /* ---------- 상단 ---------- */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: saturate(1.6) blur(14px);
        -webkit-backdrop-filter: saturate(1.6) blur(14px);
        padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
      }
      .top > * {
        max-width: 1048px;
        margin-left: auto;
        margin-right: auto;
      }
      .brand {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }
      /* 화면에는 숨기고 화면 낭독기만 읽어요 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .brand > #asof {
        flex: none;
        white-space: nowrap;
        font-size: 12px;
        color: var(--ink-3);
      }
      form {
        display: flex;
        gap: 8px;
      }
      .ac {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
      }
      .ac input {
        width: 100%;
        padding-right: 44px; /* 지우기 버튼 자리 */
      }
      .ac input::-webkit-search-cancel-button {
        display: none;
      }
      .q-clear {
        position: absolute;
        top: 0;
        right: 0;
        width: 44px;
        height: 50px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        color: var(--ink-3);
        border-radius: 14px;
      }
      .q-clear[hidden] {
        display: none;
      }
      .q-clear span {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--fill-2);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      input {
        flex: 1;
        min-width: 0;
        font: 500 16px var(--sans);
        padding: 0 16px;
        height: 50px;
        border: 0;
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
      }
      input::placeholder {
        font-weight: 400;
        color: var(--ink-3);
      }
      button {
        font: 600 15px var(--sans);
        border-radius: 14px;
        border: 0;
        padding: 0 20px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        min-height: 50px;
        transition: transform 0.1s ease, filter 0.15s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .ac-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 20;
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .ac-tabs {
        display: flex;
        gap: 6px;
        padding: 12px 12px 6px;
      }
      .ac-tabs button {
        min-height: 32px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        background: var(--fill);
        color: var(--ink-2);
        border-radius: 999px;
      }
      .ac-tabs button[aria-selected="true"] {
        background: var(--ink);
        color: var(--card);
      }
      #ac-list {
        list-style: none;
        margin: 0;
        padding: 4px 6px 8px;
        max-height: min(60vh, 380px);
        overflow-y: auto;
      }
      #ac-list li {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 12px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
      }
      #ac-list li[aria-selected="true"],
      #ac-list li:hover {
        background: var(--fill);
      }
      #ac-list .mk {
        grid-row: span 2;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        text-align: center;
        min-width: 46px;
      }
      #ac-list .mk.US {
        background: var(--primary-soft);
        color: var(--primary);
      }
      #ac-list .mk.KR {
        background: var(--good-soft);
        color: var(--good);
      }
      #ac-list .nm {
        font-weight: 600;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ac-list .nm mark {
        background: none;
        color: var(--primary);
      }
      #ac-list .sb {
        font-size: 12px;
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ac-list .empty-row {
        display: block;
        color: var(--ink-3);
        font-size: 13px;
        cursor: default;
      }
      #ac-list .empty-row:hover {
        background: none;
      }
      .search-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 18px;
        flex: none;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-top: 10px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chips button {
        min-height: 34px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 500;
        background: var(--card);
        color: var(--ink-2);
        border-radius: 999px;
        flex: none;
      }
      .demo {
        max-width: 1048px;
        margin: 4px auto 0;
        margin-inline: max(16px, calc((100% - 1048px) / 2));
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--primary-soft);
        color: var(--ink-2);
        font-size: 13px;
      }

      /* ---------- 아침 브리핑 ---------- */
      .card.brief-card {
        padding: 0;
        overflow: hidden;
      }
      .brief-open {
        display: block;
        width: 100%;
        padding: 20px;
        background: none;
        color: inherit;
        text-align: left;
        font-weight: 400;
        border-radius: inherit;
      }
      .brief-empty {
        padding: 20px;
      }
      .brief-empty .sub {
        margin: 6px 0 0;
      }
      .brief-open:active {
        transform: none;
        background: var(--fill);
      }
      .brief-head {
        margin: 6px 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.45;
        color: var(--ink);
      }
      .brief-head.big {
        font-size: 20px;
      }
      .tag-sample {
        margin-left: 4px;
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--mid-soft);
        color: var(--mid);
        font-size: 11px;
      }
      .stale {
        color: var(--warn);
        font-size: 12px;
        font-weight: 600;
      }
      .ix-row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .ix-row::-webkit-scrollbar {
        display: none;
      }
      .ix {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 12px;
        border-radius: 12px;
        background: var(--fill);
      }
      .ix small {
        color: var(--ink-3);
        font-size: 12px;
      }
      .ix strong {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .mini-label {
        margin: 16px 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .mini-label small {
        color: var(--ink-3);
        font-weight: 400;
      }
      .mini-label.up {
        color: var(--up);
      }
      .mini-label.down {
        color: var(--down);
      }
      .flow-bars {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .flow-bars li {
        display: grid;
        grid-template-columns: 44px 1fr 84px;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .flow-bars .who {
        color: var(--ink-2);
      }
      .flow-bars .fb-track {
        display: block;
        position: relative;
        height: 10px;
        border-radius: 5px;
        background: var(--fill);
      }
      .flow-bars .fb-track::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -3px;
        bottom: -3px;
        width: 1px;
        background: var(--line);
      }
      .flow-bars .fb-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 5px;
      }
      .flow-bars .fb-bar.up {
        background: var(--up);
      }
      .flow-bars .fb-bar.down {
        background: var(--down);
      }
      .flow-bars .amt {
        text-align: right;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .more-link {
        display: block;
        margin-top: 16px;
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
      }
      .themes {
        display: grid;
      }
      .theme {
        border-bottom: 1px solid var(--line);
      }
      .theme:last-child {
        border-bottom: 0;
      }
      .theme summary {
        list-style: none;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr auto auto 18px;
        align-items: center;
        column-gap: 12px;
        row-gap: 4px;
        padding: 14px 0;
      }
      .theme summary::-webkit-details-marker {
        display: none;
      }
      .theme summary::after {
        content: "";
        grid-column: 4;
        grid-row: 1;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--ink-3);
        border-bottom: 2px solid var(--ink-3);
        transform: rotate(45deg);
        justify-self: center;
        margin-top: -4px;
        transition: transform 0.15s;
      }
      .theme[open] summary::after {
        transform: rotate(225deg);
        margin-top: 4px;
      }
      .tm-name {
        font-size: 15px;
        font-weight: 700;
        min-width: 0;
      }
      .hot {
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 11px;
        font-weight: 600;
        vertical-align: 1px;
      }
      .tm-mk {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        min-width: 46px;
      }
      .tm-mk small {
        color: var(--ink-3);
        font-size: 11px;
      }
      .tm-mk strong {
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .tm-sum {
        grid-column: 1 / -1;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1.45;
      }
      .tm-body {
        padding: 0 0 16px;
      }
      .tm-body .mini-label:first-child {
        margin-top: 4px;
      }
      .tm-text {
        margin: 0;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.6;
      }
      .tm-proxy {
        margin: 12px 0 0;
        font-size: 12px;
      }
      .tchips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tchip {
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: var(--fill);
      }
      .brief-page {
        display: grid;
        gap: 12px;
      }
      .brief-page .back {
        justify-self: start;
      }
      #brief-page-body {
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      #brief-page-body h3 small {
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 500;
        margin-left: 4px;
      }
      .ix-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .ix-grid .tile span {
        font-size: 13px;
        font-weight: 600;
      }
      .macro-row {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 8px;
      }
      .macro-row li {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .macro-row small {
        color: var(--ink-3);
        font-size: 12px;
      }
      .macro-row strong {
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .macro-row span {
        font-size: 12px;
        font-weight: 600;
      }
      .two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .rank,
      .movers,
      .amts,
      .sched,
      .srcs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .rank li,
      .movers li {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 6px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .rank li small,
      .movers li small {
        grid-column: 1 / -1;
        color: var(--ink-3);
        font-size: 12px;
        line-height: 1.4;
        margin-top: 2px;
      }
      .rank .nm {
        font-weight: 600;
      }
      .slink {
        background: none;
        padding: 0;
        min-height: 0;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: var(--line);
        text-underline-offset: 3px;
      }
      .amts li {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 0;
        font-size: 14px;
      }
      .amts li span {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .who-block {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .who-title {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
      }
      .who-title small {
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 500;
        margin-left: 4px;
      }
      .issues {
        margin: 0;
        padding-left: 20px;
      }
      .issues li {
        margin-bottom: 12px;
      }
      .issues p {
        margin: 4px 0 0;
        color: var(--ink-2);
        line-height: 1.55;
      }
      .dots {
        margin: 0;
        padding-left: 18px;
        line-height: 1.6;
      }
      .sched li {
        display: flex;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .sched .t {
        flex: none;
        min-width: 64px;
        color: var(--primary);
        font-weight: 700;
      }
      .srcs li {
        padding: 4px 0;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .srcs a {
        color: var(--ink-2);
      }

      /* ---------- 판독표 ---------- */
      .chips .board-chip {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }
      .matched {
        margin: 8px 0 0;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--primary-soft);
        color: var(--ink-2);
        font-size: 13px;
      }
      .board-view {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px 40px;
        max-width: 1080px;
        margin: 0 auto;
      }
      .board-view[hidden],
      main[hidden] {
        display: none;
      }
      .board-view .back {
        background: none;
        padding: 0;
        min-height: 32px;
        margin-bottom: 8px;
        color: var(--ink-3);
        font-size: 14px;
        font-weight: 500;
      }
      .board-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .board-tools .seg {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 12px;
        background: var(--fill);
      }
      .board-tools .seg button {
        min-height: 32px;
        padding: 0 12px;
        border-radius: 9px;
        background: none;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 600;
      }
      .board-tools .seg button[aria-pressed="true"] {
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(0, 27, 55, 0.08);
      }
      .board-tools .refresh {
        min-height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 13px;
        font-weight: 600;
      }
      .board-tools .refresh:disabled {
        opacity: 0.6;
      }
      .table-wrap {
        position: relative; /* 안쪽 sr-only 글자가 페이지를 옆으로 늘리지 않게 */
        margin: 12px -20px 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table.board {
        border-collapse: separate;
        border-spacing: 0;
        width: max-content;
        min-width: 100%;
        font-size: 14px;
      }
      table.board th,
      table.board td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        text-align: left;
        font-weight: 400;
      }
      table.board .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      table.board thead th {
        padding-top: 4px;
        padding-bottom: 8px;
      }
      table.board thead button {
        background: none;
        padding: 0;
        min-height: 28px;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 600;
      }
      table.board thead button[aria-sort="ascending"],
      table.board thead button[aria-sort="descending"] {
        color: var(--ink);
      }
      table.board .stick {
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--card);
        padding-left: 20px;
        box-shadow: 1px 0 0 var(--line);
      }
      table.board .go {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 6px;
        align-items: center;
        background: none;
        padding: 0;
        text-align: left;
        max-width: 132px;
      }
      table.board .go strong {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.board .go small {
        grid-column: 1 / -1;
        color: var(--ink-3);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.board .go .mk {
        font-size: 11px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--fill);
        color: var(--ink-3);
      }
      table.board .go .mk.KR {
        color: var(--primary);
        background: var(--primary-soft);
      }
      .pos-tag {
        font-weight: 700;
      }
      .sc {
        display: inline-block;
        min-width: 36px;
        padding: 3px 0;
        border-radius: 8px;
        text-align: center;
        font-weight: 700;
      }
      .sc.on {
        background: var(--good-soft);
        color: var(--good);
      }
      .sc.mid {
        background: var(--mid-soft);
        color: var(--mid);
      }
      .sc.off {
        background: var(--warn-soft);
        color: var(--warn);
      }
      table.board .muted {
        color: var(--ink-3);
      }
      table.board .del {
        background: none;
        padding: 0;
        min-height: 32px;
        min-width: 32px;
        color: var(--ink-3);
        font-size: 18px;
      }

      /* ---------- 레이아웃 ---------- */
      main {
        padding: 12px 16px 40px;
        display: grid;
        gap: 12px;
        max-width: 1080px;
        margin: 0 auto;
      }
      .col {
        display: grid;
        gap: 12px;
        min-width: 0;
        align-content: start;
      }
      @media (min-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr) 400px;
          align-items: start;
          gap: 16px;
        }
        .col {
          gap: 16px;
        }
      }
      .card {
        background: var(--card);
        border-radius: 22px;
        padding: 24px 20px;
        min-width: 0;
      }
      .card[hidden] {
        display: none;
      }
      .eyebrow {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
      }
      h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.4;
      }
      h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }
      .sub {
        color: var(--ink-3);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .big {
        display: block;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        margin: 2px 0 0;
      }
      .lead {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink);
      }
      .callout {
        margin: 16px 0 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.6;
      }
      .callout b {
        display: block;
        color: var(--ink);
        font-size: 13px;
        margin-bottom: 2px;
      }
      .foot {
        margin: 16px 4px 0;
        font-size: 12px;
        color: var(--ink-3);
        line-height: 1.6;
      }
      .empty {
        color: var(--ink-3);
        text-align: center;
        padding: 28px 8px;
        margin: 0;
        font-size: 15px;
      }
      .error {
        color: var(--up);
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }

      /* 상태 칩: 우호(초록) · 중립(회색) · 경계(주황) */
      .chip {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
        background: var(--mid-soft);
        color: var(--mid);
      }
      .chip.on {
        background: var(--good-soft);
        color: var(--good);
      }
      .chip.off {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.blue {
        background: var(--primary-soft);
        color: var(--primary);
      }

      /* 펼치기 */
      details > summary {
        list-style: none;
        cursor: pointer;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      .more {
        margin-top: 16px;
        border-top: 1px solid var(--line);
      }
      .more > summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 2px 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .more > summary::after,
      .row > summary .val::after {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--ink-3);
        border-bottom: 2px solid var(--ink-3);
        transform: rotate(45deg) translateY(-3px);
        transition: transform 0.2s ease;
        flex: none;
      }
      .more[open] > summary::after,
      .row[open] > summary .val::after {
        transform: rotate(-135deg) translateY(-1px);
      }
      .more > .body {
        padding-top: 12px;
      }

      /* ⓘ 툴팁 버튼 */
      .tip {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        min-height: 0;
        padding: 0;
        margin-left: 4px;
        border-radius: 50%;
        background: var(--fill-2);
        color: var(--ink-2);
        font: 700 11px/1 var(--sans);
        vertical-align: 1px;
        flex: none;
        position: relative;
      }
      .tip::before {
        content: "";
        position: absolute;
        inset: -12px;
      }

      /* 바텀시트 */
      .sheet-bg {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        z-index: 51;
        width: min(100%, 480px);
        background: var(--card);
        border-radius: 24px 24px 0 0;
        padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
        transform: translate(-50%, 105%);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-height: 80vh;
        overflow-y: auto;
      }
      .sheet::before {
        content: "";
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: var(--fill-2);
        margin: 0 auto 18px;
      }
      body.sheet-open .sheet-bg {
        opacity: 1;
        pointer-events: auto;
      }
      body.sheet-open .sheet {
        transform: translate(-50%, 0);
      }
      .sheet h3 {
        font-size: 20px;
      }
      .sheet p {
        margin: 10px 0 0;
        color: var(--ink-2);
        line-height: 1.7;
      }
      .sheet .now {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        font-size: 14px;
      }
      .sheet .now b {
        display: block;
        font-size: 12px;
        color: var(--ink-3);
        margin-bottom: 2px;
      }
      .sheet button {
        width: 100%;
        margin-top: 20px;
      }

      /* ---------- 다이얼 ---------- */
      .dial {
        width: 100%;
        max-width: 260px;
        display: block;
        margin: 18px auto 0;
      }
      .dial .arc-off {
        stroke: var(--warn);
      }
      .dial .arc-neutral {
        stroke: var(--fill-2);
      }
      .dial .arc-on {
        stroke: var(--good);
      }
      .dial .tick {
        font: 500 12px var(--sans);
        fill: var(--ink-3);
      }
      .dial .needle {
        stroke: var(--ink);
        stroke-width: 4;
        stroke-linecap: round;
        transform-origin: 160px 150px;
        transition: transform 0.9s cubic-bezier(0.3, 1.3, 0.5, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .dial .needle {
          transition: none;
        }
      }
      .dial .hub {
        fill: var(--ink);
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .hero .score {
        font-size: 15px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .tone-on {
        background: var(--good-soft);
        color: var(--good);
      }
      .tone-mid {
        background: var(--mid-soft);
        color: var(--mid);
      }
      .tone-off {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* ---------- 목록 행 ---------- */
      .rows {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
      }
      .rows > li + li {
        border-top: 1px solid var(--line);
      }
      .row > summary,
      .row-static {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 0;
        min-height: 52px;
      }
      .row .name {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        display: flex;
        align-items: center;
      }
      .row .val {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--ink-2);
        text-align: right;
      }
      .row .detail {
        margin: 0 0 14px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--fill);
        font-size: 14px;
        color: var(--ink-2);
        line-height: 1.65;
      }
      .row .detail a {
        color: var(--primary);
        text-decoration: none;
        font-size: 13px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--mid);
      }
      .dot.on {
        background: var(--good);
      }
      .dot.off {
        background: var(--warn);
      }
      .tally {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      /* 홈(종합앱)으로 돌아가는 로고 링크 */
      .home-link {
        display: inline-flex;
        align-items: center;
        gap: inherit;
        color: inherit;
        text-decoration: none;
      }
      .home-back {
        font-size: 26px;
        line-height: 1;
        color: var(--ink-3);
        margin-right: -2px;
      }
      /* ---------- 숫자 타일 ---------- */
      .tiles3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }
      .tile {
        background: var(--fill);
        border-radius: 14px;
        padding: 12px 10px;
        min-width: 0;
      }
      .tile small {
        display: flex;
        align-items: center;
        gap: 2px;
        font-size: 12px;
        line-height: 1.3;
        color: var(--ink-3);
        word-break: keep-all;
      }
      .tile small > * {
        flex-shrink: 0;
      }
      /* 좁은 화면에서도 숫자가 '…'로 잘리지 않게 글자 크기를 화면 폭에 맞춰요 */
      .tile strong {
        display: block;
        font-size: clamp(15px, 4.4vw, 18px);
        font-weight: 700;
        margin-top: 2px;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      @media (max-width: 374px) {
        .tiles3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* ---------- 원자재 ---------- */
      .cmd-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }
      .cmd {
        background: var(--fill);
        border-radius: 16px;
        padding: 14px;
        min-width: 0;
      }
      .cmd small {
        color: var(--ink-3);
        font-size: 12px;
      }
      .cmd b {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .cmd strong {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .cmd .chg {
        font-size: 13px;
        font-weight: 600;
      }
      .cmd svg {
        display: block;
        width: 100%;
        height: 28px;
        margin-top: 8px;
      }
      .cmd svg path {
        fill: none;
        stroke-width: 1.6;
      }
      .cmd svg.up path {
        stroke: var(--up);
      }
      .cmd svg.down path {
        stroke: var(--down);
      }
      .defs {
        margin: 0;
        display: grid;
        gap: 12px;
      }
      .defs dt {
        font-weight: 600;
        font-size: 14px;
      }
      .defs dd {
        margin: 2px 0 0;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ---------- 종목 ---------- */
      .stock-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .stock-head h2 {
        font-size: 22px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .badge.US {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge.KR {
        background: var(--good-soft);
        color: var(--good);
      }
      .price {
        margin-top: 16px;
      }
      .price strong {
        display: block;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
      }
      .price span {
        font-size: 15px;
        font-weight: 600;
      }
      .pchart {
        margin-top: 12px;
      }
      .pc-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -4px 10px;
        padding: 0 4px;
      }
      .pc-tabs::-webkit-scrollbar {
        display: none;
      }
      .pc-tabs button {
        flex: none;
        min-height: 32px;
        padding: 0 11px;
        border-radius: 9px;
        background: none;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 600;
      }
      .pc-tabs button[aria-selected="true"] {
        background: var(--fill);
        color: var(--ink);
      }
      .pc-info {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        min-height: 44px;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .pc-info .pc-date {
        color: var(--ink-3);
        font-size: 13px;
      }
      .pc-info .sub {
        flex-basis: 100%;
        font-size: 12px;
        margin: 0;
      }
      .pc-plot {
        position: relative;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
        min-height: 96px;
      }
      .pchart.loading .pc-plot {
        opacity: 0.45;
        transition: opacity 0.15s;
      }
      .pc-svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .pc-svg .grid {
        stroke: var(--line);
        stroke-width: 1;
      }
      .pc-svg .ytick {
        fill: var(--ink-3);
        font-size: 10px;
      }
      .pc-svg .cu line,
      .pc-svg .cu rect {
        stroke: var(--up);
        fill: var(--up);
      }
      .pc-svg .cd line,
      .pc-svg .cd rect {
        stroke: var(--down);
        fill: var(--down);
      }
      .pc-svg .ln {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .pc-svg .ln.up {
        stroke: var(--up);
      }
      .pc-svg .ln.down {
        stroke: var(--down);
      }
      .pc-svg .area {
        opacity: 0.08;
      }
      .pc-svg .area.up {
        fill: var(--up);
      }
      .pc-svg .area.down {
        fill: var(--down);
      }
      .pc-svg .cross {
        stroke: var(--ink-3);
        stroke-dasharray: 3 3;
      }
      .pc-svg .dot {
        fill: var(--card);
        stroke: var(--ink);
        stroke-width: 2;
      }
      .pc-foot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        padding-right: 52px;
        color: var(--ink-3);
        font-size: 12px;
      }
      .pc-short {
        color: var(--mid);
      }
      .spark {
        width: 100%;
        height: 96px;
        display: block;
        margin-top: 20px;
      }
      .spark .line {
        fill: none;
        stroke-width: 2;
      }
      .spark.up .line {
        stroke: var(--up);
      }
      .spark.down .line {
        stroke: var(--down);
      }
      .spark .hi {
        stroke: var(--ink-3);
        stroke-dasharray: 3 4;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .spark-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 4px;
      }
      .note-kr {
        margin: 14px 0 0;
        font-size: 13px;
        color: var(--ink-2);
        background: var(--fill);
        border-radius: 12px;
        padding: 10px 14px;
      }
      .meter {
        position: relative;
        height: 8px;
        border-radius: 4px;
        background: var(--fill);
        margin: 0 0 16px;
        overflow: visible;
      }
      .meter .zl,
      .meter .zh {
        position: absolute;
        top: 0;
        bottom: 0;
      }
      .meter .zl {
        left: 0;
        background: var(--good-soft);
        border-radius: 4px 0 0 4px;
      }
      .meter .zh {
        right: 0;
        background: var(--warn-soft);
        border-radius: 0 4px 4px 0;
      }
      .meter .pin {
        position: absolute;
        top: -4px;
        width: 4px;
        height: 16px;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--ink);
      }
      .meter .pin.d {
        background: var(--ink-3);
      }

      /* 여덟 판독자 */
      .judges-sum {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-top: 16px;
      }
      .judges-sum a {
        text-decoration: none;
        color: inherit;
        text-align: center;
        padding: 10px 0 8px;
        border-radius: 12px;
        background: var(--fill);
      }
      .judges-sum small {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .judges-sum strong {
        display: block;
        font-size: 17px;
        font-weight: 700;
      }
      .judge {
        padding: 20px 0;
        scroll-margin-top: 160px;
      }
      .judge + .judge {
        border-top: 1px solid var(--line);
      }
      .judge-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .judge-head .one-liner {
        margin: 6px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
        line-height: 1.45;
      }
      .judge-head .idea {
        font-size: 13px;
        color: var(--ink-3);
      }
      .judge-head .score {
        font-size: 28px;
        font-weight: 700;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--fill);
        margin-top: 10px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
      }
      .verdict {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.65;
      }
      .judge .more {
        margin-top: 12px;
        border: 0;
      }
      .judge .more > summary {
        padding-top: 4px;
        font-size: 13px;
        color: var(--ink-3);
      }
      .checks {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .checks li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        font-size: 14px;
      }
      .checks li + li {
        border-top: 1px solid var(--line);
      }
      .checks .name {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        color: var(--ink-2);
      }
      .checks .v {
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .profile-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .profile p {
        margin: 10px 0 0;
        font-size: 14px;
        color: var(--ink-2);
      }

      const $ = (s) => document.querySelector(s);
      const esc = (v) =>
        String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v) ? "–" : v.toFixed(d));
      // 반올림해서 0이면 부호·색 없이 보여줘요 (-0.0% 방지)
      const signed = (v, d = 1, unit = "%") => {
        if (v === null || v === undefined || Number.isNaN(v)) return "–";
        const r = Number(v.toFixed(d));
        return `${r > 0 ? "+" : r < 0 ? "-" : ""}${Math.abs(r).toFixed(d)}${unit}`;
      };
      const updown = (v, d = 2) => {
        if (v === null || v === undefined || Number.isNaN(v)) return "";
        const r = Number(v.toFixed(d));
        return r > 0 ? "up" : r < 0 ? "down" : "";
      };
      const statusColor = (g) => (g === null ? "var(--fill-2)" : g >= 1 ? "var(--good)" : g > 0 ? "var(--mid)" : "var(--warn)");
      const scoreTone = (s) => (s >= 65 ? "on" : s >= 45 ? "mid" : "off");
      const toneColor = { on: "var(--good)", mid: "var(--mid)", off: "var(--warn)" };
      // 받침에 맞춰 은/는
      const withTopic = (w) => {
        const c = w.charCodeAt(w.length - 1) - 0xac00;
        return w + (c >= 0 && c < 11172 && c % 28 ? "은" : "는");
      };
      const STATUS_TEXT ={ on: "바닥 쪽", neutral: "중립", off: "과열 쪽" };
      let config = { ai: false };

      // ---------- 어려운 지표 쉬운 설명 (ⓘ 버튼) ----------
      const TERMS = {

        ],
        컨센서스: ["컨센서스", "이 종목을 분석하는 증권사 애널리스트들의 평균 의견이에요."],
        목표가: ["평균 목표가", "애널리스트들이 제시한 1년 뒤 예상 주가의 평균이에요. 자주 틀리고 주가를 뒤따라 바뀌어요."],
      };
      // 라벨 안에 이 단어가 있으면 해당 설명을 붙여요 (먼저 맞는 것 우선)
      const TERM_MATCH = [
        ["배당 보정 PEG", "배당 보정 PEG"], ["PEG", "PEG"], ["EV/EBITDA", "EV/EBITDA"], ["PCR", "PCR"], ["PSR", "PSR"], ["PBR", "PBR"],
        ["ROIC", "ROIC"], ["자본 효율", "ROIC"], ["ROE", "ROE"], ["FCF", "FCF"], ["현금을 못", "FCF"], ["이익수익률", "이익수익률"],
        ["PER", "PER"], ["기대가 너무 큰", "PER"], ["배당수익률", "배당수익률"], ["부채", "부채"], ["EPS", "EPS"], ["실적 모멘텀", "EPS"],
        ["매출총이익률", "매출총이익률"], ["순이익률", "순이익률"], ["얇은 이익", "순이익률"], ["희석", "희석"], ["미스터 마켓", "미스터 마켓"],
        ["일시적 할인", "할인"], ["RSI", "RSI"], ["스토캐스틱", "스토캐스틱"], ["%R", "%R"], ["200일", "200일선"], ["1년 고점", "1년 고점"],
        ["상대 강도", "상대 강도"], ["신용 스프레드", "신용 스프레드"], ["신용시장", "신용시장"], ["장단기", "장단기 금리차"],
        ["구리/금", "구리/금"], ["통화정책", "통화정책"], ["유동성", "유동성"], ["채권 금리", "채권 금리"], ["신용잔고", "신용잔고"],
        ["투자 심리", "투자 심리"], ["4년 주기", "4년 주기"], ["계절성", "계절성"], ["10년 패턴", "10년 패턴"], ["유가", "유가"],
        ["WTI", "유가"], ["브렌트", "브렌트"], ["천연가스", "천연가스"],
        ["구리", "구리"], ["금 가격", "금"], ["컨센서스", "컨센서스"], ["목표가", "목표가"],
      ];
      const termKey = (label) => (TERMS[label] ? label : (TERM_MATCH.find(([w]) => String(label).includes(w)) || [])[1]);
      // 라벨 옆 ⓘ 버튼. now는 '지금 이 종목에서는' 같은 구체 설명
      function tip(label, now, nowTitle = "지금은") {
        const k = termKey(label);
        if (!k && !now) return "";
        return `<button type="button" class="tip" aria-label="${esc(label)} 설명 보기" data-k="${esc(k || "")}" data-l="${esc(
          label
        )}" data-now="${esc(now || "")}" data-nt="${esc(nowTitle)}">i</button>`;
      }
      function openSheet(btn) {
        const t = TERMS[btn.dataset.k];
        $("#sheet-title").textContent = t ? t[0] : btn.dataset.l;
        $("#sheet-body").textContent = t ? t[1] : "";
        $("#sheet-body").hidden = !t;
        const now = btn.dataset.now;
        $("#sheet-now").hidden = !now;
        $("#sheet-now").innerHTML = now ? `<b>${esc(btn.dataset.nt || "지금은")}</b>${esc(now)}` : "";
        document.body.classList.add("sheet-open");
        $("#sheet").setAttribute("aria-hidden", "false");
        $("#sheet-close").focus();
      }
      function closeSheet() {
        document.body.classList.remove("sheet-open");
        $("#sheet").setAttribute("aria-hidden", "true");
      }
      document.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest(".tip");
          if (!b) return;
          e.preventDefault();
          e.stopPropagation();
          openSheet(b);
        },
        true
      );
      $("#sheet-bg").addEventListener("click", closeSheet);
      $("#sheet-close").addEventListener("click", closeSheet);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("sheet-open")) closeSheet();
      });

      const pointTone = (v) => (v >= 15 ? "on" : v > -15 ? "mid" : "off");
      // 점수(−100~+100) → 5단계 색
      const scoreVar = (v) => (v >= 45 ? "--s5" : v >= 15 ? "--s4" : v > -15 ? "--s3" : v > -45 ? "--s2" : "--s1");
      const scoreHead = (label, score) =>
        `<div class="hero"><strong class="stance" style="color:var(${scoreVar(score)})">${esc(
          label
        )}</strong><span class="score-pill" style="background:var(${scoreVar(score)})">${signed(score, 0, "점")}</span></div>`;
      // 문장 속 숫자를 굵게 강조 (먼저 나누고 각각 이스케이프)
      const hl = (text) =>
        String(text ?? "")
          // 단위(%, %p, 곳, 배, 점, 원)가 붙었거나 쉼표가 있는 숫자만 강조해요 ('10년' 같은 건 제외)
          .split(/([+\-]?\d[\d,]*(?:\.\d+)?(?:%p|%|곳|배|점|원)|[+\-]?\d{1,3}(?:,\d{3})+(?:\.\d+)?)/)
          .map((p, i) => (i % 2 ? `<b class="hl">${esc(p)}</b>` : esc(p)))
          .join("");
      let MACRO = null;
      const dayText = (d) => {
        if (!d) return "";
        const [, mo, da] = String(d).slice(0, 10).split("-");
        return `${Number(mo)}월 ${Number(da)}일`;
      };
      const timeText = (iso) => {
        const d = new Date(iso);
        return Number.isNaN(d.getTime())
          ? ""
          : `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      };
      // '더보기' 버튼: 같은 카드 안의 접힌 영역을 펼치고 접어요
      document.addEventListener("click", (e) => {
        const b = e.target.closest(".more-btn");
        if (!b) return;
        const area = document.getElementById(b.dataset.target);
        if (!area) return;
        const open = area.hidden;
        area.hidden = !open;
        b.setAttribute("aria-expanded", String(open));
        b.textContent = open ? "접기" : "더보기";
        const lead = b.previousElementSibling;
        if (lead && lead.classList.contains("lead")) lead.classList.toggle("clamp", !open);
      });
      // 미국 종목 가격 옆 원화 환산 (시장 데이터의 환율이 오면 채워요)
      let FX = null;
      function fillKrw() {
        const el = document.getElementById("krw-eq");
        if (!el || !FX) return;
        el.textContent = `≈ ${Math.round(Number(el.dataset.usd) * FX.price).toLocaleString("ko-KR")}원 (환율 ${FX.price.toLocaleString("ko-KR")}원)`;
      }

      // 조회 중인 요청 수를 세서 로딩바를 켜고 꺼요
      let pending = 0;
      function busy(d) {
        pending = Math.max(0, pending + d);
        const bar = document.getElementById("progress");
        if (!bar) return;
        bar.classList.toggle("on", pending > 0);
        bar.setAttribute("aria-hidden", String(pending === 0));
      }
      async function api(path) {
        busy(1);
        try {
          return await apiRaw(path);
        } finally {
          busy(-1);
        }
      }
      async function apiRaw(path) {
        let code = "";
        try {
          code = localStorage.getItem("accessCode") || "";
        } catch {}
        const res = await fetch(path, { headers: code ? { "x-access-code": code } : {} });
        if (res.status === 401) {
          showGate();
          throw new Error("접근 코드가 필요해요.");
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `요청에 실패했어요 (${res.status})`);
        return data;
      }

      function sparkPath(vals, W, H, pad = 2) {
        const mn = Math.min(...vals),
          mx = Math.max(...vals);
        return vals
          .map((v, i) => `${i ? "L" : "M"}${((i / (vals.length - 1)) * W).toFixed(1)} ${(pad + (1 - (v - mn) / (mx - mn || 1)) * (H - pad * 2)).toFixed(1)}`)
          .join("");
      }

      async function loadMarket() {
        try {
          const m = await api("/api/macro");
          // 머리줄이 좁아서 오늘이면 시각만 보여줘요 (전체 날짜는 title로)
          const upd = m.updatedAt ? new Date(m.updatedAt) : null;
          const today = upd && upd.toDateString() === new Date().toDateString();
          $("#asof").textContent = upd ? (today ? timeText(m.updatedAt).split(" ").pop() : timeText(m.updatedAt)) : `${m.asOf} 기준`;
          $("#asof").title = upd ? `업데이트 ${timeText(m.updatedAt)}` : "";
          FX = m.fx || null;
          MACRO = m;
          fillKrw();
          fillDiv();
          const v = m.view || {};
          const tone = pointTone(m.score);
          const body = $("#market-body");
          const hasMore = v.action || (v.lenses && v.lenses.length) || (v.watch && v.watch.length);
          body.innerHTML = `
        ${scoreHead(m.stance, m.score)}
        <p class="sub">신호 ${m.signals.length}개의 점수를 합쳐 −100(과열)~+100(저점)으로 환산했어요</p>
        ${v.headline ? `<p class="lead clamp">${esc(v.headline)}</p>` : ""}
        ${
          hasMore
            ? `<button type="button" class="more-btn" data-target="mk-more" aria-expanded="false">더보기</button>
        <div class="more-area" id="mk-more" hidden>
          ${v.action ? `<div class="callout"><b>원칙대로라면</b>${esc(v.action)}</div>` : ""}
          ${
            v.watch && v.watch.length
              ? `<p class="sub" style="margin-top:14px">켜지면 비중을 늘릴 신호</p><div class="tally">${v.watch
                  .map((w) => `<span class="chip blue">${esc(w)}</span>`)
                  .join("")}</div>`
              : ""
          }
          ${
            v.lenses && v.lenses.length
              ? `<dl class="defs" style="margin-top:16px">${v.lenses
                  .map((l) => `<div><dt>${esc(l.who)}</dt><dd>${esc(l.text)}${
                    l.source && /^https?:\/\//.test(l.source.url || "") ? ` <a href="${esc(l.source.url)}" target="_blank" rel="noopener">출처</a>` : ""
                  }</dd></div>`)
                  .join("")}</dl>`
              : ""
          }
        </div>`
            : ""
        }`;

          renderEgg(m.egg);

          const cnt = (st) => m.signals.filter((s) => s.status === st).length;
          const sc = $("#signals-card");
          sc.hidden = false;
          sc.innerHTML = `<h2 id="signals-title">신호 ${m.signals.length}개</h2>
        <div class="tally"><span class="chip on">바닥 쪽 ${cnt("on")}</span><span class="chip">중립 ${cnt(
            "neutral"
          )}</span><span class="chip off">과열 쪽 ${cnt("off")}</span></div>
        <ul class="rows">${m.signals
          .map(
            (s) => `<li><details class="row">
          <summary><span class="dot ${esc(s.status)}" aria-hidden="true"></span><span class="name">${esc(s.title)}${tip(
              s.title
            )}</span><span class="val">${esc(String(s.value).split(" (")[0])}<span class="pts ${esc(s.status)}">${signed(
              s.points,
              0,
              ""
            )}</span></span></summary>
          <p class="detail"><span class="chip ${esc(s.status)}" style="margin-right:6px">${STATUS_TEXT[s.status] || ""}</span>${esc(
              s.detail
            )}${
              s.date
                ? `<span style="display:block;margin-top:8px;font-size:12px;color:var(--ink-3)">${esc(String(s.value))} · ${dayText(
                    s.date
                  )} 기준${s.source ? " · " + esc(s.source) : ""}${s.source === "FRED" ? " (1~2일 늦게 발표돼요)" : ""}</span>`
                : ""
            }</p></details></li>`
          )
          .join("")}</ul>`;

          if ((m.commodities && m.commodities.length) || m.fx) {
            const cms = m.commodities || [];
            const price = (c) => (c.price >= 100 ? Math.round(c.price).toLocaleString("en-US") : c.price.toFixed(2));
            const fx = m.fx;
            const row = (o) => `<li><details class="row mkt">
          <summary><span class="name">${esc(o.name)}${tip(o.tipKey || o.name)}${o.unit ? `<small>${esc(o.unit)}</small>` : ""}</span><span class="val"><span class="price-v">${
              o.price
            }</span><span class="chg-v ${updown(o.m1, 1)}">${signed(o.m1, 1)}</span><span class="chg-v ${updown(o.y1, 0)}">${signed(
              o.y1,
              0
            )}</span></span></summary>
          <p class="detail">${o.chip ? `<span class="chip" style="margin-right:6px">${esc(o.chip)}</span>` : ""}${esc(o.text)}<span style="display:block;margin-top:8px;font-size:12px;color:var(--ink-3)">${esc(
              o.foot
            )}</span></p></details></li>`;
            const cm = $("#commodities");
            cm.hidden = false;
            cm.innerHTML = `<h2 id="cmd-title">환율·원자재</h2>
        <p class="sub">${dayText((fx || cms[0]).date)} 기준 · 오른쪽 숫자는 1개월 / 1년 등락이에요</p>
        <ul class="rows">${
          fx
            ? row({
                name: fx.name, tipKey: "환율", unit: "", price: `${fx.price.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}원`,
                m1: fx.m1, y1: fx.y1, chip: fx.zone, text: fx.note,
                foot: `1년 범위 ${Math.round(fx.low).toLocaleString("ko-KR")}~${Math.round(fx.high).toLocaleString("ko-KR")}원 · ${dayText(fx.date)} · 네이버(하나은행 고시)`,
              })
            : ""
        }${cms
          .map((c) =>
            row({
              name: c.name, unit: c.unit, price: price(c), m1: c.m1, y1: c.y1, text: c.meaning,
              foot: `3개월 ${signed(c.m3, 0)} · ${dayText(c.date)} · ${c.source}`,
            })
          )
          .join("")}</ul>`;
          }

          const hv = m.houseViews;
          if (hv) {
            const cls = (st) =>
              /강세/.test(st) && !/신중/.test(st) ? "on" : /신중한/.test(st) ? "" : /신중|약세/.test(st) ? "off" : "";
            const sp = $("#street-panel");
            sp.hidden = false;
            sp.innerHTML = `<h2 id="street-title">월가는 어떻게 보나요</h2>
        <p class="sub">${esc(hv.index.name)} ${hv.index.level.toLocaleString("en-US")} 기준 · ${esc(hv.asOf)} 갱신</p>
        ${(() => {
          const withT = hv.firms.filter((f) => f.target);
          const avg = withT.length ? withT.reduce((a, f) => a + f.target, 0) / withT.length : null;
          const up = avg ? ((avg - hv.index.level) / hv.index.level) * 100 : null;
          const bulls = hv.firms.filter((f) => /강세/.test(f.stance)).length;
          return `<div class="tiles3">
          <div class="tile"><small>강세 기관</small><strong>${bulls}<span style="font-size:13px;color:var(--ink-3)"> / ${hv.firms.length}곳</span></strong></div>
          <div class="tile"><small>목표치 평균</small><strong>${avg ? Math.round(avg).toLocaleString("en-US") : "–"}</strong></div>
          <div class="tile"><small>지금 대비</small><strong class="${updown(up, 1)}">${signed(up, 1)}</strong></div>
        </div>`;
        })()}
        <p class="lead">${hl(hv.summary)}</p>
        <div class="callout"><b>판독기와 비교하면</b>${hl(hv.compare)}</div>
        <ul class="rows">${hv.firms
          .map(
            (f) => `<li><details class="row">
          <summary><span class="name" style="flex-wrap:wrap;gap:6px">${esc(f.name)}<span class="chip ${cls(f.stance)}">${esc(
              f.stance
            )}</span></span><span class="val"><span class="num" style="color:var(--ink);font-weight:600">${
              f.target ? f.target.toLocaleString("en-US") : "–"
            }</span><span class="num ${updown(f.upside, 1)}" style="min-width:48px">${
              f.upside === null ? "–" : signed(f.upside, 1)
            }</span></span></summary>
          <p class="detail">${esc(f.thesis)}${
              f.target2 ? ` (상단 ${f.target2.toLocaleString("en-US")})` : ""
            } <span style="color:var(--ink-3)">${esc(f.horizon)}</span><a href="${esc(
              f.source
            )}" target="_blank" rel="noopener">출처 ${esc(f.date)}</a></p></details></li>`
          )
          .join("")}</ul>
        <p class="foot">${esc(hv.caution)}</p>`;
          }
        } catch (e) {
          $("#market-body").innerHTML = `<p class="empty error">${esc(e.message)}</p>`;
        }
      }

      function spark(history, high, currency) {
        const money = (v) => (currency === "KRW" ? Math.round(v).toLocaleString("ko-KR") + "원" : "$" + fmt(v, 2));
        const closes = history.map((p) => p[1]);
        const min = Math.min(...closes, high),
          max = Math.max(...closes, high);
        const W = 320,
          H = 96,
          pad = 4;
        const y = (v) => pad + (1 - (v - min) / (max - min || 1)) * (H - pad * 2);
        const d = closes.map((v, i) => `${i ? "L" : "M"}${((i / (closes.length - 1)) * W).toFixed(1)} ${y(v).toFixed(1)}`).join("");
        const dir = closes[closes.length - 1] >= closes[0] ? "up" : "down";
        return `<svg class="spark ${dir}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 1년 주가">
    <line class="hi" x1="0" x2="${W}" y1="${y(high)}" y2="${y(high)}"/>
    <path class="line" d="${d}" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="spark-labels"><span>1년 전</span><span>점선은 1년 고점 ${money(high)}</span></div>`;
      }

      // ---------- 기간별 차트 ----------
      // 봉 단위(tf)와 기간(years). 봉이 많으면 선 차트로 그려요
      const CHART_TABS = [
        { id: "d", label: "일봉", tf: "day", years: 1, show: 120 },
        { id: "w", label: "주봉", tf: "week", years: 3, show: 110 },
        { id: "m", label: "월봉", tf: "month", years: 10, show: 120 },
        { id: "y", label: "연봉", tf: "year", years: 30 },
        { id: "5y", label: "5년", tf: "week", years: 5 },
        { id: "10y", label: "10년", tf: "month", years: 10, line: true },
        { id: "20y", label: "20년", tf: "month", years: 20 },
        { id: "30y", label: "30년", tf: "month", years: 30 },
      ];
      let chartTab = (() => {
        try {
          const v = localStorage.getItem("chartTab");
          return CHART_TABS.some((t) => t.id === v) ? v : "d";
        } catch {
          return "d";
        }
      })();
      let chartReq = 0,
        chartData = null;
      const chartMoney = (v, cur) =>
        cur === "KRW" ? Math.round(v).toLocaleString("ko-KR") + "원" : "$" + (v >= 1000 ? Math.round(v).toLocaleString("en-US") : fmt(v, 2));
      function barDate(d, tf) {
        const [y, m, dd] = d.split("-");
        if (tf === "year") return `${y}년`;
        if (tf === "month") return `${y}.${m}`;
        return `${y.slice(2)}.${m}.${dd}`;
      }
      async function loadChart() {
        const box = $("#pchart");
        if (!box) return;
        const tab = CHART_TABS.find((t) => t.id === chartTab);
        const req = ++chartReq;
        box.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === chartTab));
        box.classList.add("loading");
        try {
          const d = await api(`/api/chart/${encodeURIComponent(box.dataset.sym)}/${tab.tf}/${tab.years}`);
          if (req !== chartReq || !$("#pchart")) return;
          chartData = { ...d, tab, cur: box.dataset.cur, bars: tab.show ? d.bars.slice(-tab.show) : d.bars };
          drawChart();
        } catch (e) {
          if (req !== chartReq) return;
          $("#pc-info").innerHTML = `<span class="sub">${esc(e.message || "차트를 불러오지 못했어요.")}</span>`;
        } finally {
          if (req === chartReq) box.classList.remove("loading");
        }
      }
      function drawChart(hover = null) {
        const c = chartData;
        const plot = $("#pc-plot");
        if (!c || !plot) return;
        const bars = c.bars;
        const candle = !c.tab.line && bars.length <= 130;
        const W = Math.max(280, Math.round(plot.clientWidth || 320)),
          H = 190,
          R = 52, // 오른쪽 가격 눈금 자리
          T = 8,
          B = 8;
        const lo = Math.min(...bars.map((b) => (candle ? b[3] : b[4]))),
          hi = Math.max(...bars.map((b) => (candle ? b[2] : b[4])));
        const span = hi - lo || hi || 1;
        const y = (v) => T + (1 - (v - lo) / span) * (H - T - B);
        const step = (W - R) / bars.length;
        const x = (i) => step * (i + 0.5);
        let g = "";
        // 가로 눈금 3줄
        for (const f of [0, 0.5, 1]) {
          const v = lo + span * f;
          g += `<line class="grid" x1="0" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
            <text class="ytick" x="${W - R + 6}" y="${(y(v) + 4).toFixed(1)}">${esc(chartMoney(v, c.cur))}</text>`;
        }
        if (candle) {
          const bw = Math.max(1, Math.min(14, step * 0.66));
          bars.forEach((b, i) => {
            const up = b[4] >= b[1];
            const cx = x(i).toFixed(1);
            const top = y(Math.max(b[1], b[4])),
              bot = y(Math.min(b[1], b[4]));
            g += `<g class="${up ? "cu" : "cd"}"><line x1="${cx}" x2="${cx}" y1="${y(b[2]).toFixed(1)}" y2="${y(b[3]).toFixed(1)}"/><rect x="${(
              x(i) -
              bw / 2
            ).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}"/></g>`;
          });
        } else {
          const pts = bars.map((b, i) => `${x(i).toFixed(1)} ${y(b[4]).toFixed(1)}`);
          const dir = bars[bars.length - 1][4] >= bars[0][4] ? "up" : "down";
          g += `<path class="area ${dir}" d="M${pts[0].split(" ")[0]} ${H - B}L${pts.join("L")}L${x(bars.length - 1).toFixed(1)} ${H - B}Z"/>
            <path class="ln ${dir}" d="M${pts.join("L")}"/>`;
        }
        if (hover !== null) {
          const b = bars[hover];
          g += `<line class="cross" x1="${x(hover).toFixed(1)}" x2="${x(hover).toFixed(1)}" y1="${T}" y2="${H - B}"/>
            <circle class="dot" cx="${x(hover).toFixed(1)}" cy="${y(b[4]).toFixed(1)}" r="3.5"/>`;
        }
        plot.innerHTML = `<svg class="pc-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(
          c.tab.label
        )} 차트">${g}</svg>`;
        // 위 정보줄: 평소엔 기간 수익률·고저, 손가락을 대면 그 봉의 시세
        const first = bars[0],
          last = bars[bars.length - 1];
        if (hover !== null) {
          const b = bars[hover],
            prev = bars[hover - 1];
          const ch = prev ? ((b[4] - prev[4]) / prev[4]) * 100 : null;
          $("#pc-info").innerHTML = `<span class="pc-date">${esc(barDate(b[0], c.tf))}</span><strong>${esc(chartMoney(b[4], c.cur))}</strong>${
            ch !== null ? `<span class="${updown(ch)}">${signed(ch, 2)}</span>` : ""
          }${candle ? `<span class="sub">시 ${esc(chartMoney(b[1], c.cur))} · 고 ${esc(chartMoney(b[2], c.cur))} · 저 ${esc(chartMoney(b[3], c.cur))}</span>` : ""}`;
        } else {
          const ret = ((last[4] - first[1]) / first[1]) * 100;
          const yrs = (new Date(last[0]) - new Date(first[0])) / (365.25 * 864e5);
          const cagr = yrs >= 2 && first[1] > 0 ? (Math.pow(last[4] / first[1], 1 / yrs) - 1) * 100 : null;
          const hiB = Math.max(...bars.map((b) => b[2])),
            loB = Math.min(...bars.map((b) => b[3]));
          $("#pc-info").innerHTML = `<span class="pc-date">기간 수익률</span><strong class="${updown(ret)}">${signed(ret, 1)}</strong>${
            cagr !== null ? `<span class="sub">연평균 ${signed(cagr, 1)}</span>` : ""
          }<span class="sub">최고 ${esc(chartMoney(hiB, c.cur))} · 최저 ${esc(chartMoney(loB, c.cur))}</span>`;
        }
        $("#pc-foot").innerHTML = `<span>${esc(barDate(first[0], c.tf))}</span>${
          c.short && !c.tab.show ? `<span class="pc-short">${esc(first[0].slice(0, 4))}년부터 자료가 있어요</span>` : ""
        }<span>${esc(barDate(last[0], c.tf))}</span>`;
      }
      // 손가락·마우스로 봉 짚기
      function chartPoint(e) {
        const plot = $("#pc-plot");
        if (!chartData || !plot) return;
        const r = plot.getBoundingClientRect();
        const W = Math.max(280, Math.round(plot.clientWidth || 320)) - 52;
        const i = Math.floor(((e.clientX - r.left) / W) * chartData.bars.length);
        drawChart(Math.max(0, Math.min(chartData.bars.length - 1, i)));
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("#pchart [data-tab]");
        if (!t) return;
        chartTab = t.dataset.tab;
        try {
          localStorage.setItem("chartTab", chartTab);
        } catch {}
        loadChart();
      });
      document.addEventListener("pointermove", (e) => e.target.closest?.("#pc-plot") && chartPoint(e));
      document.addEventListener("pointerdown", (e) => e.target.closest?.("#pc-plot") && chartPoint(e));
      document.addEventListener("pointerleave", (e) => e.target.closest?.("#pc-plot") && drawChart(), true);
      let chartResize;
      window.addEventListener("resize", () => {
        clearTimeout(chartResize);
        chartResize = setTimeout(() => drawChart(), 150);
      });

      function techBlock(items) {
        if (!items || !items.length) return "";
        return `<section class="card"><h2>기술적 신호</h2><p class="sub">초록 구간은 과매도, 주황 구간은 과매수예요</p>
    <ul class="rows">${items
      .map(
        (t) => `<li><div class="row-static row"><span class="name">${esc(t.label.replace(/\s*\(.*\)$/, ""))}${tip(
          t.label,
          t.note
        )}</span><span class="chip ${esc(t.status)}">${esc(t.display)}</span></div>
      ${
        t.value !== undefined
          ? `<div class="meter" role="img" aria-label="${esc(t.label)} ${esc(t.display)}">
        <i class="zl" style="width:${t.low}%"></i><i class="zh" style="width:${100 - t.high}%"></i>
        ${t.value2 !== undefined ? `<i class="pin d" style="left:${Math.max(1, Math.min(99, t.value2))}%"></i>` : ""}
        <i class="pin" style="left:${Math.max(1, Math.min(99, t.value))}%"></i></div>`
          : ""
      }</li>`
      )
      .join("")}</ul></section>`;
      }

      function judgeBlock(j) {
        const score = j.score ?? 0;
        const color = j.score === null || j.score === undefined ? "var(--ink-3)" : toneColor[scoreTone(score)];
        return `<div class="judge" id="j-${esc(j.key)}">
    <div class="judge-head"><div><h3>${esc(j.name)}</h3><div class="idea">${esc(j.idea)}</div>${j.oneLiner ? `<p class="one-liner">“${esc(j.oneLiner)}”</p>` : ""}</div><div class="score" style="color:${color}">${
          j.score ?? "–"
        }</div></div>
    <div class="bar"><i style="width:${score}%;background:${color}"></i></div>
    <p class="verdict">${esc(j.verdict)}</p>
    <details class="more"><summary>판단 근거 ${j.checks.length}가지</summary><div class="body">
      <ul class="checks">${j.checks
        .map(
          (c) => `<li><span class="name">${esc(c.label)}${tip(c.label, c.note, "판단 기준")}</span><span class="v">${esc(c.value)}</span>
        <span class="mark" style="background:${statusColor(c.grade)}" role="img" aria-label="${
            c.grade === null ? "제외" : c.grade >= 1 ? "충족" : c.grade > 0 ? "보통" : "미달"
          }"></span></li>`
        )
        .join("")}</ul></div></details>
    ${
      j.profile
        ? `<details class="more profile"><summary>${esc(withTopic(j.name.split(" ").pop()))} 어떤 투자자예요?</summary><div class="body">
      <div class="profile-chips"><span class="chip blue">${esc(j.profile.type)}</span><span class="chip">보유 ${esc(
            j.profile.horizon
          )}</span><span class="chip">${esc(j.profile.risk)}</span></div>
      <p><b>늘 던지는 질문</b> ${esc(j.profile.question)}</p><p><b>맹점</b> ${esc(j.profile.blindSpot)}</p></div></details>`
        : ""
    }
  </div>`;
      }

      // 배당 카드: 객관적인 숫자와 규칙 기반 한 줄만 보여줘요
      function divCard(s, money) {
        const d = s.dividend || {};
        const y = d.yield;
        if (y === null || y === undefined)
          return `<section class="card" id="div-card"><p class="eyebrow">배당</p><p class="sub">이 종목은 배당 자료를 받지 못했어요</p></section>`;
        if (y === 0 || !(d.perShare > 0))
          return `<section class="card" id="div-card"><p class="eyebrow">배당</p><strong class="stance">배당을 주지 않는 종목이에요</strong>
        <p class="sub">이익을 배당 대신 사업에 다시 투자하거나 자사주 매입에 쓰는 회사일 수 있어요</p></section>`;
        const per = s.currency === "KRW" ? `${Math.round(d.perShare).toLocaleString("ko-KR")}원` : `$${fmt(d.perShare, 2)}`;
        const pay = d.payout;
        const payNote =
          pay === null || pay === undefined ? "" :
          pay > 100 ? "번 돈보다 많이 배당하고 있어요. 이대로 이어질 수 있는지 확인이 필요해요." :
          pay >= 60 ? "이익의 대부분을 배당으로 돌려주고 있어요." :
          "이익에 여유를 두고 배당하고 있어요.";
        const hist = d.history || [];
        return `<section class="card" id="div-card">
        <p class="eyebrow">배당${tip("배당수익률")}</p>
        <div class="div-hero"><strong>${fmt(y, 2)}%</strong><span class="sub" style="margin:0">1주당 1년 ${per}</span></div>
        <p class="sub" id="div-vs" data-y="${y}" data-kr="${s.market === "KR" ? 1 : 0}"></p>
        <div class="tiles3">
          <div class="tile"><small>배당성향${tip("배당성향")}</small><strong>${pay === null || pay === undefined ? "–" : fmt(pay, 0) + "%"}</strong></div>
          <div class="tile"><small>배당락일${tip("배당락일")}</small><strong style="font-size:15px">${d.exDate ? dayText(d.exDate) : "–"}</strong></div>
          <div class="tile"><small>지급일</small><strong style="font-size:15px">${d.payDate ? dayText(d.payDate) : "–"}</strong></div>
        </div>
        ${payNote ? `<p class="sub" style="margin-top:12px">${hl(`배당성향 ${fmt(pay, 0)}% · `)}${esc(payNote)}</p>` : ""}
        ${
          hist.length
            ? `<p class="sub" style="margin-top:14px">연도별 주당배당금</p><div class="div-hist">${hist
                .map((h) => `<span class="chip">${esc(h.year)} · ${s.currency === "KRW" ? Math.round(h.value).toLocaleString("ko-KR") + "원" : "$" + fmt(h.value, 2)}</span>`)
                .join("")}</div>`
            : ""
        }
      </section>`;
      }
      // 미 국채 10년과 배당수익률 비교 (시장 데이터가 오면 채워요)
      function fillDiv() {
        const el = document.getElementById("div-vs");
        if (!el || !MACRO || !MACRO.tenYear) return;
        const y = Number(el.dataset.y);
        const gap = y - MACRO.tenYear;
        el.innerHTML = hl(
          `미 국채 10년 금리 ${MACRO.tenYear.toFixed(2)}%보다 ${Math.abs(gap).toFixed(2)}%p ${gap >= 0 ? "높아요" : "낮아요"}${
            el.dataset.kr === "1" ? " (한국 종목이라 참고만 해요)" : ""
          }`
        );
      }

      // ---------- 코스톨라니 달걀 ----------
      const EGG_POS = {
        A1: [200, 232, "start"], A2: [222, 150, "start"], A3: [196, 70, "start"],
        B1: [64, 70, "end"], B2: [38, 150, "end"], B3: [60, 232, "end"],
      };
      function eggSvg(e) {
        const cur = e.phase;
        const pts = Object.entries(EGG_POS)
          .map(([id, [x, y, anchor]]) => {
            const now = id === cur;
            const dx = anchor === "start" ? 14 : -14;
            const a = (e.table.find((t) => t.id === id) || {}).asset;
            // 좌표 옆 포지션: 'A · B'는 두 줄로 나눠요
            const lines = a ? a.label.split(" · ") : [];
            const assetText = lines
              .map((l, i) => `<tspan x="${x + dx}" dy="${i === 0 ? 19 : 17}" class="asset ${a.kind}">${esc(l)}</tspan>`)
              .join("");
            return `<g class="egg-pt" data-id="${id}" role="button" tabindex="0" aria-label="${id} 국면 행동 보기">${

            }<circle cx="${x}" cy="${y}" r="20" fill="transparent"/><circle class="pt${now ? " now" : ""}" cx="${x}" cy="${y}" r="${
              now ? 8 : 6
            }"/><text x="${x + dx}" y="${y - 2}" text-anchor="${anchor}" class="${now ? "now" : ""}"><tspan>${id}${now ? " 지금" : ""}</tspan>${assetText}</text></g>`;
          })
          .join("");
        return `<svg class="egg" viewBox="-110 0 480 305" role="img" aria-label="코스톨라니 달걀, 지금 위치 ${esc(cur)}">
      <path class="shell" d="M130 22 C 200 22, 232 120, 232 175 C 232 240, 190 278, 130 278 C 70 278, 28 240, 28 175 C 28 120, 60 22, 130 22 Z"/>
      <path class="arrow" d="M150 262 C 205 250, 218 205, 218 160"/>
      <path class="arrow" d="M110 38 C 55 50, 42 95, 42 140"/>

      <text class="axis" x="130" y="296" text-anchor="middle">시장 저점 · 금리 고점</text>
      <text class="axis" x="130" y="150" text-anchor="middle">A 상승 ↑ · ↓ B 하락</text>
      ${pts}
    </svg>`;
      }
      let EGG_DATA = null;
      // 좌표를 누르면 그 국면의 조건과 행동을 보여줘요
      function showEggPick(id) {
        const box = document.getElementById("egg-pick");
        if (!box || !EGG_DATA) return;
        const x = EGG_DATA.table.find((t) => t.id === id);
        if (!x) return;
        const cur = id === EGG_DATA.phase;
        box.hidden = false;
        box.innerHTML = `<b>${esc(x.name)}${cur ? " · 지금 국면" : ""} → ${esc(x.action)}${x.asset ? ` · ${esc(x.asset.label)}` : ""}</b><span style="display:block;margin-bottom:6px;font-size:13px">금리 ${esc(
          x.rate
        )} · 거래량 ${esc(x.volume)} · 심리 ${esc(x.mood)}</span>이럴 땐 보통 이렇게 행동해요. ${esc(x.guide)}${

      document.addEventListener("keydown", (ev) => {

          ev.preventDefault();
          showEggPick(g.dataset.id);
        }
      });
      function renderEgg(e) {
        EGG_DATA = e;
        const card = $("#egg-card");
        if (!e) return;
        const ex = e.table.find((x) => x.id === e.phase);
        const fitOf = e.phases.find((p) => p.id === e.phase).fit;
        const mark = (v) => (v >= 1 ? `<span class="fit y" aria-label="일치">✓</span>` : v > 0 ? `<span class="fit p" aria-label="일부 일치">△</span>` : `<span class="fit n" aria-label="불일치">✗</span>`);
        const i = e.inputs;
        const pct = (v, d = 2) => (v === null || v === undefined ? "–" : `${v >= 0 ? "+" : ""}${v.toFixed(d)}`);
        const rows = [
          ["금리", e.now.rate, ex.rate, fitOf[0],
            `10년물 20일 평균 ${i.tenYear20 ?? "–"}% (1년 범위 ${i.tenYearPos ?? "–"}% 위치, 3개월 ${pct(i.tenYear3m)}%p) · 정책금리 ${i.fedNow ?? "–"}% (6개월 ${pct(i.fed6m)}%p)`],

            `${i.vol20 !== null && i.vol20 !== undefined ? `S&P 500 최근 20일 평균 거래량이 평소의 ${i.vol20}배예요 · 20일 중 거래량 급증 ${i.spikeDays}일(그중 2% 넘게 빠진 날 ${i.selloffDays}일)` : "S&P 500 거래량 자료를 받지 못했어요"} · 신용잔고 최고치 대비 ${pct(i.marginFromRecord, 1)}%`],
          ["심리", e.now.mood, ex.mood, fitOf[2], `VIX 20일 평균 ${i.vix20 ?? "–"} (오늘 ${i.vix ?? "–"}, 3개월 최고 ${i.vixPeak3m ?? "–"})`],
        ];
        card.hidden = false;
        card.innerHTML = `<p class="eyebrow" id="egg-title">코스톨라니 달걀${tip("코스톨라니 달걀")}</p>
        <strong class="stance">지금은 <span style="color:var(--primary)">${esc(e.name)}</span> 국면에 가까워요</strong>

        <div class="tally"><span class="chip">세 축 중 ${e.score}점 일치</span>${
          e.leaning
            ? `<span class="chip">${esc(e.leaning.name)} 쪽으로 기우는 중 (${e.leaning.weeks ? `${e.leaning.weeks}/${e.leaning.need}주` : "이번 주 처음"})</span>`

          e.alerts && e.alerts.length
            ? `<div class="callout"><b>하루짜리 신호예요 · 국면 판단에는 바로 넣지 않아요</b>${e.alerts

          e.asset ? `<span style="display:block;margin-top:8px;font-weight:600;color:var(--ink)">자산 포지션: ${esc(e.asset.label)} (${esc(e.asset.flow)})</span>` : ""

        <div class="callout" id="egg-pick" aria-live="polite" hidden></div>
        <ul class="rows">${rows
          .map(
            ([axis, now, want, f, detail]) => `<li><details class="row">
          <summary><span class="name">${axis}</span><span class="val"><span>${esc(now)}</span>${mark(f)}</span></summary>
          <p class="detail"><b style="display:block;color:var(--ink);font-size:13px;margin-bottom:4px">${esc(e.phase)}에서 기대하는 모습: ${esc(
              want
            )}</b>${esc(detail)}</p></details></li>`
          )
          .join("")}</ul>
        <details class="more"><summary>여섯 국면별 행동 보기</summary><div class="body">
          <ul class="rows" style="margin-top:0">${e.table
            .map(
              (x) => `<li><details class="row"${x.id === e.phase ? " open" : ""}>
            <summary><span class="name"${x.id === e.phase ? ' style="color:var(--primary);font-weight:700"' : ""}>${esc(x.name)}${
                x.id === e.phase ? " · 지금" : ""
              }</span><span class="val"><span>${esc(x.asset ? x.asset.label : x.action)}</span><span class="pts">${e.phases.find((p) => p.id === x.id).score}점</span></span></summary>
            <p class="detail"><span style="display:block;margin-bottom:6px;font-size:13px;color:var(--ink-3)">금리 ${esc(x.rate)} · 거래량 ${esc(
                x.volume
              )} · 심리 ${esc(x.mood)}</span>${esc(x.guide)}${
                x.asset ? `<span style="display:block;margin-top:8px;font-weight:600;color:var(--ink)">자산 이동: ${esc(x.asset.flow)} · 행동: ${esc(x.action)}</span>` : ""
              }</p></details></li>`
            )
            .join("")}</ul>
          <p class="foot" style="margin:12px 0 0">금리 방향이 큰 틀(내리는 쪽 A, 오르는 쪽 B)을 정하고, 거래량·심리는 하루 값이 아닌 20일 평균으로 그 안의 단계를 골라요. 각 축은 단순 규칙(맞음 1, 일부 0.5)으로 채점하고, 지난 24주를 금요일마다 다시 판정해 같은 새 국면이 3주 연속 나올 때만 국면을 바꿔요. 그래서 하루 급등락에는 국면이 흔들리지 않아요. 실제 국면 판단이나 투자 권유가 아니에요. 자산 포지션(예금 → 채권 → 주식 → 부동산 → 예금)은 코스톨라니의 주식 원칙을 여러 자산으로 넓힌, 국내에서 널리 쓰는 해석이에요.</p>
        </div></details>`;
        document.querySelectorAll("#egg-card .egg-pt").forEach((g) => g.classList.remove("picked"));
