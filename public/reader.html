      // ---------- 맨 위 롤링 지수 ----------
      let TICKS = [],
        tickIdx = 0,
        tickTimer = null;
      const tickHtml = (x) => {
        const v = x.unit === "원" ? x.value.toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "원" : x.value.toLocaleString("en-US", { maximumFractionDigits: 2 });
        return `<span class="t-item"><span class="t-name">${esc(x.name)}</span><span class="t-val">${v}</span><span class="t-chg ${updown(
          x.changePct
        )}">${signed(x.changePct, 2)}</span></span>`;
      };
      function showTick() {
        const el = $("#ticker");
        if (!TICKS.length) return;
        tickIdx %= TICKS.length;
        el.innerHTML = tickHtml(TICKS[tickIdx]);
      }
      function startTicker() {
        clearInterval(tickTimer);
        tickTimer = setInterval(() => {
          if (document.hidden) return;
          tickIdx++;
          showTick();
        }, 3500);
      }
      async function loadTicker(quiet = false) {
        try {
          const r = await (quiet ? apiRaw : api)("/api/indices");
          if (!(r.items || []).length) return;
          const first = !TICKS.length;
          TICKS = r.items;
          $("#ticker").hidden = false;
          $("#ticker-all").innerHTML = TICKS.map((x) => `<li>${esc(x.name)} ${x.value} (${signed(x.changePct, 2)})</li>`).join("");
          if (first) {
            showTick();
            startTicker();
          }
        } catch {}
      }
      // 누르면 바로 다음 지수로
      $("#ticker").addEventListener("click", () => {
        tickIdx++;
        showTick();
        startTicker();
      });
      // 5분마다 새 값으로
      setInterval(() => {
        if (!document.hidden) loadTicker(true); // 자동 갱신은 로딩바 없이
      }, 5 * 60e3);

      function streetBody(t, money) {

        const col = $("#stock-area"); // 브리핑 카드는 남겨 두고 판독 영역만 바꿔요

          ? `<section class="card" id="street-card"><h2>월가 애널리스트 의견</h2>${streetBody(t, money)}</section>`
          : s.streetLazy
          ? `<section class="card" id="street-card"><h2>월가 애널리스트 의견</h2>
        <p class="sub">컨센서스·목표가·최근 의견 변경을 보여줘요</p>
        <button type="button" class="ghost" id="street-btn">불러오기</button></section>`
          : ""
      }
      <p class="foot">공개된 투자 원칙을 수치 규칙으로 옮긴 결과예요. 실제 인물의 의견이나 투자 권유가 아니에요. 데이터 ${esc(
        new Date(s.fetchedAt).toLocaleString("ko-KR")
      )}</p>`;
          fillKrw();
          fillDiv();
          col.querySelectorAll(".judges-sum a").forEach((a) =>
            a.addEventListener("click", (e) => {
              e.preventDefault();
              document.getElementById("j-" + a.dataset.j)?.scrollIntoView({ behavior: "smooth", block: "start" });
            })
          );
          loadChart();
          const sb = $("#street-btn");
          if (sb)
            sb.addEventListener("click", async () => {
              sb.disabled = true;
              sb.textContent = "불러오는 중이에요";
              try {
                const r = await api(
                  `/api/street/${encodeURIComponent(s.symbol)}/${s.consensus.favorable}/${Number(s.price).toFixed(2)}`
                );
                $("#street-card").innerHTML = r.street
                  ? `<h2>월가 애널리스트 의견</h2>${streetBody(r.street, money)}`
                  : `<h2>월가 애널리스트 의견</h2><p class="sub">이 종목은 애널리스트 의견 자료가 없어요</p>`;
              } catch (e) {
                sb.disabled = false;
                sb.textContent = "다시 시도";
                sb.insertAdjacentHTML("beforebegin", `<p class="sub error">${esc(e.message)}</p>`);
              }
            });
          const btn = $("#ai-btn");
          if (btn)
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              btn.textContent = "해설을 쓰는 중이에요";
              try {
                $("#ai-text").textContent = (await api(`/api/stock/${encodeURIComponent(s.symbol)}/commentary`)).text;
                btn.remove();
              } catch (e) {
                $("#ai-text").textContent = e.message;
                btn.disabled = false;
                btn.textContent = "다시 시도";
              }
            });
        } catch (e) {
          if (req !== stockReq) return;
          col.innerHTML = `<section class="card"><p class="empty error">${esc(e.message)}</p></section>`;
        }
      }

      // ---------- 자동완성 ----------
      let STOCKS = [];
      fetch("/stocks.json")
        .then((r) => r.json())
        .then((d) => {
          STOCKS = d;
          renderChips();
        })
        .catch(() => {});
      const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
      const cho = (str) =>
        [...str]
          .map((ch) => {
            const c = ch.charCodeAt(0) - 0xac00;
            return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch;
          })
          .join("");
      const isCho = (q) => /^[ㄱ-ㅎ]+$/.test(q);
      const isKR = (x) => x.m !== "US";
      const ETF_RE = /^(KODEX|TIGER|ACE|SOL|RISE|PLUS|KBSTAR|HANARO|ARIRANG|KOSEF|KINDEX|KIWOOM|TIMEFOLIO|KOACT|TRUSTON|BNK|WON|FOCUS)[\s\d가-힣]/i;
      const isEtf = (x) => x.t === "ETF" || /\bETF\b/i.test(x.n || "") || (isKR(x) && ETF_RE.test(x.n || ""));
      const marketText = (m) =>
        m === "US" ? "미국" : /KOSDAQ|코스닥/i.test(m) ? "코스닥" : /KOSPI|코스피/i.test(m) ? "코스피" : "국내";
      let acFilter = "all",
        acItems = [],
        acIndex = -1,
        acTimer = null,
        remoteTimer = null,
        acQuery = "";
      // 한글 조합 중 Enter 처리용
      let composing = false,
        enterAfterCompose = false,
        lastSubmit = 0;

      function scoreOf(x, q) {
        const Q = q.toUpperCase(),
          name = x.n.toUpperCase(),
          alt = (x.k || "").toUpperCase(),
          sym = x.s.toUpperCase();
        if (sym === Q) return 100;
        if (sym.startsWith(Q)) return 85;
        if (name.startsWith(Q)) return 75;
        if (alt.split(/\s+/).some((w) => w.startsWith(Q))) return 65;
        if (name.includes(Q)) return 55;
        if (alt.includes(Q)) return 45;
        // 띄어쓰기 없이 쳐도 찾아요 (예: 마쉬앤맥레넌, 윌리스타워스왓슨)
        const nsp = (v) => v.replace(/[\s&.,]/g, "");
        if (nsp(Q).length >= 2 && (nsp(name).includes(nsp(Q)) || nsp(alt).includes(nsp(Q)))) return 42;
        if (isCho(q) && (cho(x.n).includes(q) || cho(x.k || "").includes(q))) return 40;
        return 0;
      }
      function mark(text, q) {
        const i = text.toUpperCase().indexOf(q.toUpperCase());
        return i < 0 || isCho(q)
          ? esc(text)
          : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
      }
      function localMatches(q) {
        return STOCKS.map((x) => ({ x, sc: scoreOf(x, q) }))
          .filter((r) => r.sc > 0)
          .filter((r) => acFilter === "all" || (acFilter === "KR" ? isKR(r.x) : !isKR(r.x)))
          .sort((a, b) => b.sc - a.sc)
          .slice(0, 8)
          .map((r) => r.x);
      }
      function renderAc(q, items, loading) {
        acQuery = q;
        acItems = items;
        acIndex = items.length ? 0 : -1;
        const list = $("#ac-list");
        list.innerHTML = items.length
          ? items
              .map(
                (x, i) => `<li role="option" id="ac-${i}" aria-selected="${i === 0}" data-i="${i}">
        <span class="mk ${isKR(x) ? "KR" : "US"}">${isEtf(x) ? (isKR(x) ? "국내 ETF" : "미국 ETF") : marketText(x.m)}</span>
        <span class="nm">${mark(x.n, q)}</span>
        <span class="sb">${esc(x.s)}${x.k ? " · " + mark(x.k, q) : ""}</span></li>`
              )
              .join("")
          : `<li class="empty-row">${
              loading ? "더 찾는 중…" : `'${esc(q)}'와 맞는 종목이 없어요. Enter로 그대로 검색할 수 있어요.`
            }</li>`;
        $("#ac-panel").hidden = false;
        $("#q").setAttribute("aria-expanded", "true");
      }
      function closeAc() {
        $("#ac-panel").hidden = true;
        $("#q").setAttribute("aria-expanded", "false");
        acIndex = -1;
      }
      function moveAc(d) {
        if (!acItems.length) return;
        acIndex = (acIndex + d + acItems.length) % acItems.length;
        [...$("#ac-list").children].forEach((li, i) => li.setAttribute("aria-selected", String(i === acIndex)));
        $("#q").setAttribute("aria-activedescendant", `ac-${acIndex}`);
        $(`#ac-${acIndex}`)?.scrollIntoView({ block: "nearest" });
      }
      function pick(x) {
        $("#q").value = x.n; syncClear();
        closeAc();
        loadStock(x.s, true);
        $("#q").blur();
      }

      function runAc() {
        const q = $("#q").value.trim();
        if (!q) return closeAc();
        const local = localMatches(q);
        renderAc(q, local, false);
        clearTimeout(remoteTimer);
        // 목록에 적을 때만 서버 검색 (미국은 FMP 호출 한도를 쓰므로 아끼기)
        // 국내(한글·숫자)는 네이버라 2글자부터, 미국은 FMP 한도를 아끼려고 3글자부터 조금 더 기다렸다 찾아요
        const kr = /[가-힣]|^\d{2,6}$/.test(q);
        if (local.length >= 3 || config.demo || isCho(q) || q.length < (kr ? 2 : 3)) return;
        remoteTimer = setTimeout(async () => {
          try {
            const r = await api(`/api/search/${encodeURIComponent(q)}`);
            if ($("#q").value.trim() !== q) return;
            const extra = (r.results || [])
              .map((x) => ({ s: x.s, n: x.n, k: "", m: x.kr ? x.m || "KR" : "US" }))
              .filter((x) => acFilter === "all" || (acFilter === "KR" ? isKR(x) : !isKR(x)))
              .filter((x) => !local.some((l) => l.s === x.s));
            renderAc(q, [...local, ...extra].slice(0, 10), false);
          } catch {}
        }, kr ? 450 : 800);
      }
      // 검색어 지우기(x): 글자가 있을 때만 보이고, 누르면 비운 뒤 바로 다시 입력할 수 있게 포커스를 둬요
      const syncClear = () => ($("#q-clear").hidden = !$("#q").value);
      $("#q-clear").addEventListener("mousedown", (e) => e.preventDefault()); // 입력창 포커스가 빠지지 않게
      $("#q-clear").addEventListener("click", () => {
        $("#q").value = "";
        syncClear();
        clearTimeout(acTimer);
        clearTimeout(remoteTimer);
        closeAc();
        $("#q").focus();
      });
      $("#q").addEventListener("input", () => {
        syncClear();
        clearTimeout(acTimer);
        acTimer = setTimeout(runAc, 80);
      });
      $("#q").addEventListener("focus", () => {
        if ($("#q").value.trim()) runAc();
      });
      // Enter 검색: 조합이 끝난 최종 입력값으로 다시 찾아서 검색해요
      function submitSearch() {
        if (Date.now() - lastSubmit < 400) return;
        lastSubmit = Date.now();
        clearTimeout(acTimer);
        clearTimeout(remoteTimer);
        const q = $("#q").value.trim();
        if (!q) return;
        const chosen = acQuery === q && acIndex >= 0 && acItems[acIndex] ? acItems[acIndex] : localMatches(q)[0];
        if (chosen) return pick(chosen);
        closeAc();
        loadStock(q, true);
        $("#q").blur();
      }
      $("#q").addEventListener("compositionstart", () => (composing = true));
      $("#q").addEventListener("compositionend", () => {
        composing = false;
        if (enterAfterCompose) {
          enterAfterCompose = false;
          setTimeout(submitSearch, 0);
        }
      });
      $("#q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (composing || e.isComposing) enterAfterCompose = true;
          else setTimeout(submitSearch, 0);
          return;
        }
        if ($("#ac-panel").hidden) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          moveAc(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          moveAc(-1);
        } else if (e.key === "Escape") closeAc();
      });
      $("#ac-list").addEventListener("mousedown", (e) => e.preventDefault());
      $("#ac-list").addEventListener("click", (e) => {
        const li = e.target.closest("li[data-i]");
        if (li) pick(acItems[Number(li.dataset.i)]);
      });
      document.querySelector(".ac-tabs").addEventListener("mousedown", (e) => e.preventDefault());
      document.querySelector(".ac-tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-f]");
        if (!b) return;
        acFilter = b.dataset.f;
        document.querySelectorAll(".ac-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
        runAc();
      });
      $("#q").addEventListener("blur", () => setTimeout(closeAc, 120));

      // 최근 검색은 이 기기에만 저장
      const DEFAULTS = ["VZ", "GOOGL", "JPM", "005930", "000660", "105560"];
      const DEFAULT_NAMES = { "005930": "삼성전자", "000660": "SK하이닉스", "105560": "KB금융" };
      // 최근 검색: 예전에는 입력한 글자를 그대로 저장했어요. 지금은 { s: 종목코드, n: 이름, m: 시장 }으로 저장해요
      function recent() {
        try {
          return JSON.parse(localStorage.getItem("recent") || "[]")
            .map((x) => (typeof x === "string" ? { s: x } : x))
            .filter((x) => x && x.s && (/^\d{6}$/.test(x.s) || /^[A-Z][A-Z.\-]{0,9}$/.test(x.s)));
        } catch {
          return [];
        }
      }
      function remember(sym, name, market) {
        const list = [{ s: sym, n: name, m: market }, ...recent().filter((x) => x.s !== sym)].slice(0, 8);
        try {
          localStorage.setItem("recent", JSON.stringify(list));
        } catch {}
        renderChips();
      }
      function renderChips() {
        const seen = new Set();
        const list = (config.demo ? config.demoSymbols.map((s) => ({ s })) : [...recent(), ...DEFAULTS.map((s) => ({ s }))])
          .filter((x) => !seen.has(x.s) && seen.add(x.s))
          .slice(0, 10);
        // 국내는 이름, 미국은 티커로 보여줘요
        const label = (x) =>
          /^\d{6}$/.test(x.s) ? x.n || DEFAULT_NAMES[x.s] || board()[x.s]?.n || x.s : x.s;
        const n = Object.keys(board()).length;
        $("#chips").innerHTML =
          `<button type="button" class="board-chip" data-board="1">판독표${n ? " " + n : ""}</button>` +
          list.map((x) => `<button type="button" data-s="${esc(x.s)}">${esc(label(x))}</button>`).join("");
      }
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.board) return openBoard();
        $("#q").value = b.textContent; syncClear();
        showView("stock");
        loadStock(b.dataset.s, true);
      });
      $("#search").addEventListener("submit", (e) => {
        e.preventDefault();
        submitSearch();
      });

      // ---------- 판독표: 검색한 종목을 표로 모아 봐요 (이 기기에만 저장) ----------
      const JUDGE_COLS = [
        ["williams", "래리"],
        ["buffett", "버핏"],
        ["munger", "멍거"],
        ["lynch", "린치"],
        ["druckenmiller", "드러켄밀러"],
        ["ackman", "애크먼"],
        ["burry", "버리"],
        ["kim", "김영익"],
      ];
      let shownKey = "";
      let boardSort = { key: "at", dir: -1 },
        boardFilter = "all",
        boardBusy = false;
      // 국내는 6자리 코드, 미국은 티커 하나로 통일해요 (같은 종목이 두 줄로 저장되지 않게)
      const stockKey = (s) => (s.market === "KR" ? String(s.symbol).replace(/\.(KS|KQ)$/, "") : String(s.symbol).toUpperCase());
      function board() {
        try {
          return JSON.parse(localStorage.getItem("board") || "{}") || {};
        } catch {
          return {};
        }
      }
      function writeBoard(b) {
        try {
          localStorage.setItem("board", JSON.stringify(b));
        } catch {}
      }
      function saveBoard(s) {
        const b = board();
        const key = stockKey(s);
        const scores = {};
        (s.judges || []).forEach((j) => (scores[j.key] = j.score ?? null));
        b[key] = {
          s: key,
          n: s.name,
          market: s.market,
          marketName: s.marketName,
          currency: s.currency,
          price: s.price,
          changePct: s.changePct,
          label: s.position?.label || null,
          needle: s.needle,
          favorable: s.consensus?.favorable ?? null,
          total: s.consensus?.total ?? null,
          scores,
          divYield: s.dividend?.yield ?? null,
          pe: s.metrics?.pe ?? null,
          at: s.fetchedAt || new Date().toISOString(),
        };
        // 너무 많아지면 오래 조회한 것부터 지워요
        const keys = Object.keys(b).sort((x, y) => (b[y].at < b[x].at ? -1 : 1));
        keys.slice(60).forEach((k) => delete b[k]);
        writeBoard(b);
      }

      // 화면 3개: 판독(main) · 판독표(#/board) · 아침 브리핑(#/briefing)
      function showView(v) {
        document.querySelector("main").hidden = v !== "stock";
        $("#board-view").hidden = v !== "board";
        $("#brief-view").hidden = v !== "briefing";
        if (v === "stock" && /^#\/(board|briefing)$/.test(location.hash)) history.pushState(null, "", location.pathname + location.search);
      }
      function openBoard() {
        if (location.hash !== "#/board") location.hash = "/board";
        else route();
      }
      function route() {
        const h = decodeURIComponent(location.hash.slice(1));
        if (h === "/board") {
          showView("board");
          renderBoard();
          window.scrollTo(0, 0);
          return;
        }
        if (h === "/briefing") {
          showView("briefing");
          renderBriefPage();
          window.scrollTo(0, 0);
          return;
        }
        showView("stock");
        if (h && h !== shownKey) {
          $("#q").value = board()[h]?.n || h; syncClear();
          loadStock(h);
        }
      }
      window.addEventListener("hashchange", route);

      const scoreCell = (v) =>
        v === null || v === undefined
          ? `<td class="num muted">–</td>`
          : `<td class="num"><span class="sc ${scoreTone(v)}">${Math.round(v)}</span></td>`;
      const boardMoney = (r) =>
        r.price === null || r.price === undefined
          ? "–"
          : r.currency === "KRW"
          ? Math.round(r.price).toLocaleString("ko-KR") + "원"
          : "$" + fmt(r.price, 2);
      function boardValue(r, k) {
        if (k === "name") return r.market === "KR" ? r.n : r.s;
        if (k in (r.scores || {}) || JUDGE_COLS.some(([jk]) => jk === k)) return r.scores?.[k] ?? -1;
        const v = r[k];
        return v === null || v === undefined ? -Infinity : v;
      }
      function renderBoard() {
        const all = Object.values(board());
        const rows = all
          .filter((r) => boardFilter === "all" || r.market === boardFilter)
          .sort((a, b) => {
            const x = boardValue(a, boardSort.key),
              y = boardValue(b, boardSort.key);
            return (typeof x === "string" ? x.localeCompare(y, "ko") : x - y) * boardSort.dir;
          });
        const th = (k, label, cls = "num") =>
          `<th scope="col" class="${cls}"><button type="button" data-sort="${k}" aria-sort="${
            boardSort.key === k ? (boardSort.dir > 0 ? "ascending" : "descending") : "none"
          }">${label}${boardSort.key === k ? (boardSort.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`;
        const filterBtn = (f, t) =>
          `<button type="button" data-filter="${f}" aria-pressed="${boardFilter === f}">${t}${
            f === "all" ? "" : " " + all.filter((r) => r.market === f).length
          }</button>`;
        $("#board-body").innerHTML = all.length
          ? `<div class="board-tools">
          <div class="seg">${filterBtn("all", "전체 " + all.length)}${filterBtn("US", "미국")}${filterBtn("KR", "국내")}</div>
          <button type="button" class="refresh" id="board-refresh"${boardBusy ? " disabled" : ""}>${
              boardBusy ? "갱신 중이에요" : "모두 새로고침"
            }</button>
        </div>
        <p class="sub" id="board-status">점수는 마지막으로 조회한 시점 기준이에요. 65점 이상은 초록, 45점 미만은 주황이에요.</p>
        <div class="table-wrap" tabindex="0" aria-label="판독표, 옆으로 넘겨 볼 수 있어요">
          <table class="board">
            <thead><tr>
              ${th("name", "종목", "stick")}
              ${th("needle", "가격 위치", "")}
              ${th("favorable", "호의적")}
              ${JUDGE_COLS.map(([k, l]) => th(k, l)).join("")}
              ${th("divYield", "배당")}
              ${th("pe", "PER")}
              ${th("price", "현재가")}
              ${th("changePct", "등락")}
              ${th("at", "조회")}
              <th scope="col"><span class="sr-only">삭제</span></th>
            </tr></thead>
            <tbody>${
              rows.length
                ? rows
                    .map(
                      (r) => `<tr>
              <th scope="row" class="stick"><button type="button" class="go" data-go="${esc(r.s)}">
                <span class="mk ${r.market === "KR" ? "KR" : "US"}">${r.market === "KR" ? "국내" : "미국"}</span>
                <strong>${esc(r.market === "KR" ? r.n : r.s)}</strong>
                <small>${esc(r.market === "KR" ? r.s : r.n || "")}</small>
              </button></th>
              <td class="pos">${r.label ? `<span class="pos-tag" style="color:var(${scoreVar(r.needle ?? 0)})">${esc(r.label)}</span>` : "–"}</td>
              <td class="num">${r.favorable === null || r.favorable === undefined ? "–" : `<strong>${r.favorable}</strong>/${r.total || 7}`}</td>
              ${JUDGE_COLS.map(([k]) => scoreCell(r.scores?.[k])).join("")}
              <td class="num">${r.divYield === null || r.divYield === undefined ? "–" : fmt(r.divYield, 2) + "%"}</td>
              <td class="num">${r.pe === null || r.pe === undefined || r.pe <= 0 ? "–" : fmt(r.pe, 1) + "배"}</td>
              <td class="num">${boardMoney(r)}</td>
              <td class="num ${updown(r.changePct)}">${r.changePct === null || r.changePct === undefined ? "–" : signed(r.changePct, 2)}</td>
              <td class="num muted">${esc(timeText(r.at))}</td>
              <td><button type="button" class="del" data-del="${esc(r.s)}" aria-label="${esc(r.n || r.s)} 표에서 빼기">×</button></td>
            </tr>`
                    )
                    .join("")
                : `<tr><td colspan="${JUDGE_COLS.length + 9}" class="muted">이 시장에서 조회한 종목이 없어요.</td></tr>`
            }</tbody>
          </table>
        </div>`
          : `<p class="empty">아직 판독한 종목이 없어요.<br />종목을 검색하면 여기에 차곡차곡 쌓여요.</p>`;
      }
      async function refreshBoard() {
        if (boardBusy) return;
        const keys = Object.keys(board());
        if (!keys.length) return;
        boardBusy = true;
        renderBoard();
        let fail = 0;
        for (let i = 0; i < keys.length; i++) {
          const st = $("#board-status");
          if (st) st.textContent = `${keys.length}개 중 ${i + 1}번째를 갱신하고 있어요`;
          try {
            saveBoard(await api(`/api/stock/${encodeURIComponent(keys[i])}`));
          } catch {
            fail++;
          }
        }
        boardBusy = false;
        renderBoard();
        const st = $("#board-status");
        if (st) st.textContent = fail ? `${fail}개는 불러오지 못했어요. 나머지는 방금 갱신했어요.` : "방금 모두 갱신했어요.";
      }
      $("#board-view").addEventListener("click", (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        if (t.id === "board-back") {
          location.hash = shownKey ? encodeURIComponent(shownKey) : "";
          return;
        }
        if (t.id === "board-refresh") return refreshBoard();
        if (t.dataset.filter) {
          boardFilter = t.dataset.filter;
          return renderBoard();
        }
        if (t.dataset.sort) {
          const k = t.dataset.sort;
          boardSort = boardSort.key === k ? { key: k, dir: -boardSort.dir } : { key: k, dir: k === "name" ? 1 : -1 };
          return renderBoard();
        }
        if (t.dataset.del) {
          const b = board();
          delete b[t.dataset.del];
          writeBoard(b);
          renderBoard();
          return renderChips();
        }
        if (t.dataset.go) {
          $("#q").value = board()[t.dataset.go]?.n || t.dataset.go; syncClear();
          location.hash = encodeURIComponent(t.dataset.go);
        }
      });

      // ---------- 아침 브리핑 (data/briefing.json, 매일 아침 예약 작업이 올려요) ----------
      let BRIEF = null;
      const WHO = [
        ["foreign", "외국인"],
        ["institution", "기관"],
        ["individual", "개인"],
      ];
      const nz = (v) => v !== null && v !== undefined && Number.isFinite(v);
      const eok = (v) => (nz(v) ? `${v > 0 ? "+" : ""}${Math.round(v).toLocaleString("ko-KR")}억` : "–");
      const pct = (v) => (nz(v) ? signed(v, 2) : "–");
      function kDate(ymd) {
        if (!ymd) return "";
        const [y, m, d] = ymd.split("-").map(Number);
        const w = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
        return `${m}월 ${d}일(${w})`;
      }
      function briefAge(b) {
        const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
        const days = Math.round((new Date(today) - new Date(b.date)) / 864e5);
        return days > 0 ? `${days === 1 ? "어제" : days + "일 전"} 브리핑이에요` : "";
      }
      async function loadBriefing() {
        try {
          BRIEF = await api("/api/briefing");
        } catch {
          BRIEF = null;
        }
        renderBriefCard();
        if (location.hash === "#/briefing") renderBriefPage();
      }
      function flowBars(f, key = "kospi") {
        return flowBarsVals(WHO.map(([k]) => f?.[k]?.[key]));
      }
      function flowBarsVals(vals) {
        const max = Math.max(1, ...vals.filter(nz).map(Math.abs));
        return `<ul class="flow-bars">${WHO.map(([k, label], i) => {
          const v = vals[i];
          const w = nz(v) ? Math.max(4, (Math.abs(v) / max) * 50) : 0;
          return `<li><span class="who">${label}</span><span class="fb-track"><span class="fb-bar ${v > 0 ? "up" : "down"}" style="${
            v > 0 ? "left:50%" : `right:50%`
          };width:${w}%"></span></span><span class="amt ${nz(v) ? (v > 0 ? "up" : v < 0 ? "down" : "") : ""}">${eok(v)}</span></li>`;
        }).join("")}</ul>`;
      }
      const idxChip = (x) =>
        `<span class="ix"><small>${esc(x.name)}</small><strong class="${updown(x.changePct)}">${pct(x.changePct)}</strong></span>`;
      // 테마 하나의 대표 등락: 미국·한국 중 있는 값의 평균 (정렬·칩용)
      const themeMove = (t) => {
        const v = [t.us?.changePct, t.kr?.changePct].filter(nz);
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      };
      const mkPct = (m, flag) =>
        `<span class="tm-mk"><small>${flag}</small><strong class="${updown(m?.changePct)}">${nz(m?.changePct) ? signed(m.changePct, 1) : "–"}</strong></span>`;
      function themeSection(themes) {
        if (!themes?.length) return "";
        return `<section class="card">
          <h3>섹터 한눈에 <small>눌러서 수급 보기</small></h3>
          <div class="themes">${themes
            .map((t) => {
              const leaders = (t.leaders || []).filter((x) => x && x.name);
              return `<details class="theme">
              <summary>
                <span class="tm-name">${esc(t.name)}${t.hot ? '<span class="hot">오늘 주목</span>' : ""}</span>
                ${mkPct(t.us, "미국")}${mkPct(t.kr, "한국")}
                <span class="tm-sum">${esc(t.summary)}</span>
              </summary>
              <div class="tm-body">
                ${
                  t.flows && WHO.some(([k]) => nz(t.flows[k]))
                    ? `<p class="mini-label">한국 수급 <small>순매수 금액</small></p>${flowBarsVals(WHO.map(([k]) => t.flows[k]))}`
                    : `<p class="sub">이 테마의 한국 투자자별 수급은 확인하지 못했어요.</p>`
                }
                ${t.usFlow ? `<p class="mini-label">미국 자금 흐름</p><p class="tm-text">${esc(t.usFlow)}</p>` : ""}
                ${
                  leaders.length
                    ? `<p class="mini-label">주도 종목</p><ul class="movers">${leaders
                        .map((x) => `<li>${stockLink(x)}<strong class="${updown(x.changePct)}">${pct(x.changePct ?? null)}</strong></li>`)
                        .join("")}</ul>`
                    : ""
                }
                ${t.detail ? `<p class="mini-label">왜 움직였나</p><p class="tm-text">${esc(t.detail)}</p>` : ""}
                ${
                  [t.us?.proxy && "미국: " + t.us.proxy, t.kr?.proxy && "한국: " + t.kr.proxy].filter(Boolean).length
                    ? `<p class="sub tm-proxy">기준 ${esc([t.us?.proxy && "미국 " + t.us.proxy, t.kr?.proxy && "한국 " + t.kr.proxy].filter(Boolean).join(" · "))}</p>`
                    : ""
                }
              </div>
            </details>`;
            })
            .join("")}</div>
        </section>`;
      }
      function themeChips(themes) {
        const list = (themes || []).map((t) => [t, themeMove(t)]).filter(([, v]) => nz(v)).sort((a, b) => b[1] - a[1]);
        if (list.length < 2) return "";
        const top = list.filter(([, v]) => v > 0).slice(0, 2);
        const bottom = list.filter(([, v]) => v < 0).slice(-2).reverse();
        const chip = ([t, v]) => `<span class="tchip ${v > 0 ? "up" : "down"}">${esc(t.name.replace(/\(.*\)/, ""))} ${signed(v, 1)}</span>`;
        return `<div class="tchips">${[...top, ...bottom].map(chip).join("")}</div>`;
      }
      function renderBriefCard() {
        const el = $("#brief-card");
        if (!BRIEF) return (el.hidden = true);
        el.hidden = false;
        if (BRIEF.empty) {
          el.innerHTML = `<div class="brief-empty"><p class="eyebrow" id="brief-title">아침 브리핑</p><p class="sub">매일 아침 7시쯤 어제 장 정리가 여기에 올라와요.</p></div>`;
          return;
        }
        const b = BRIEF;
        const idx = [...(b.kr?.indices || []), ...(b.us?.indices || []).slice(0, 2)];
        const age = briefAge(b);
        el.innerHTML = `<button type="button" class="brief-open" id="brief-open" aria-label="아침 브리핑 자세히 보기">
          <p class="eyebrow" id="brief-title">아침 브리핑 · ${esc(kDate(b.date))}${b.sample ? ' <span class="tag-sample">예시</span>' : ""}${
            age ? ` <span class="stale">${esc(age)}</span>` : ""
          }</p>
          <p class="brief-head">${esc(b.headline)}</p>
          ${idx.length ? `<div class="ix-row">${idx.map(idxChip).join("")}</div>` : ""}
          ${b.themes?.length ? `<p class="mini-label">강한 섹터 · 약한 섹터</p>${themeChips(b.themes)}` : ""}
          ${
            b.kr?.flows && !b.kr.closed
              ? `<p class="mini-label">코스피 수급 <small>순매수 금액</small></p>${flowBars(b.kr.flows)}`
              : ""
          }
          <span class="more-link">자세히 보기 ›</span>
        </button>`;
      }
      const stockLink = (x) =>
        x.symbol
          ? `<button type="button" class="slink" data-go="${esc(x.symbol)}">${esc(x.name)}</button>`
          : `<span>${esc(x.name)}</span>`;
      function sectorList(sec) {
        const row = (x) =>
          `<li><span class="nm">${esc(x.name)}</span><strong class="${updown(x.changePct)}">${pct(x.changePct ?? null)}</strong>${
            x.why ? `<small>${esc(x.why)}</small>` : ""
          }</li>`;
        return `<div class="two">
          <div><p class="mini-label up">강했어요</p><ul class="rank">${(sec?.up || []).map(row).join("") || "<li class='muted'>–</li>"}</ul></div>
          <div><p class="mini-label down">약했어요</p><ul class="rank">${(sec?.down || []).map(row).join("") || "<li class='muted'>–</li>"}</ul></div>
        </div>`;
      }
      function moverList(list) {
        if (!list?.length) return "";
        return `<p class="mini-label">눈에 띈 종목</p><ul class="movers">${list
          .map(
            (x) =>
              `<li>${stockLink(x)}<strong class="${updown(x.changePct)}">${pct(x.changePct ?? null)}</strong>${
                x.why ? `<small>${esc(x.why)}</small>` : ""
              }</li>`
          )
          .join("")}</ul>`;
      }
      function marketSection(m, title, extra = "", withSectors = true) {
        if (!m) return "";
        if (m.closed)
          return `<section class="card"><h3>${title} <small>${esc(kDate(m.date))}</small></h3><p class="sub">휴장이었어요.</p></section>`;
        return `<section class="card">
          <h3>${title} <small>${esc(kDate(m.date))}</small></h3>
          <div class="ix-grid">${(m.indices || [])
            .map(
              (x) =>
                `<div class="tile"><small>${esc(x.name)}</small><strong>${nz(x.value) ? x.value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "–"}</strong><span class="${updown(
                  x.changePct
                )}">${pct(x.changePct)}</span></div>`
            )
            .join("")}</div>
          ${extra}
          ${withSectors && m.sectors ? `<p class="mini-label" style="margin-top:20px">섹터·업종</p>${sectorList(m.sectors)}` : ""}
          ${moverList(m.movers)}
        </section>`;
      }
      function macroRow(list) {
        if (!list?.length) return "";
        return `<ul class="macro-row">${list
          .map(
            (x) =>
              `<li><small>${esc(x.name)}</small><strong>${esc(x.value || "–")}</strong>${
                x.change ? `<span class="${x.dir > 0 ? "up" : x.dir < 0 ? "down" : ""}">${esc(x.change)}</span>` : ""
              }</li>`
          )
          .join("")}</ul>`;
      }
      function flowDetail(f) {
        if (!f) return "";
        const amtRow = (x) =>
          `<li>${stockLink(x)}<span class="${nz(x.amount) ? (x.amount > 0 ? "up" : "down") : ""}">${eok(x.amount ?? null)}</span></li>`;
        return `<section class="card">
          <h3>돈이 어디로 몰렸나 <small>한국 수급</small></h3>
          ${f.summary ? `<div class="callout">${esc(f.summary)}</div>` : ""}
          <p class="mini-label">코스피 순매수</p>${flowBars(f, "kospi")}
          <p class="mini-label" style="margin-top:14px">코스닥 순매수</p>${flowBars(f, "kosdaq")}
          ${WHO.map(([k, label]) => {
            const w = f[k];
            if (!w) return "";
            return `<div class="who-block">
              <p class="who-title">${label} <small>코스피 ${eok(w.kospi)} · 코스닥 ${eok(w.kosdaq)}</small></p>
              ${w.into || w.outOf ? `<p class="sub">${w.into ? `몰린 곳 <b>${esc(w.into)}</b>` : ""}${w.into && w.outOf ? " · " : ""}${w.outOf ? `빠진 곳 <b>${esc(w.outOf)}</b>` : ""}</p>` : ""}
              <div class="two">
                <div><p class="mini-label up">많이 산 종목</p><ul class="amts">${(w.buy || []).map(amtRow).join("") || "<li class='muted'>–</li>"}</ul></div>
                <div><p class="mini-label down">많이 판 종목</p><ul class="amts">${(w.sell || []).map(amtRow).join("") || "<li class='muted'>–</li>"}</ul></div>
              </div>
              ${w.note ? `<p class="sub">${esc(w.note)}</p>` : ""}
            </div>`;
          }).join("")}
        </section>`;
      }
      function renderBriefPage() {
        const el = $("#brief-page-body");
        if (!BRIEF) {
          el.innerHTML = `<section class="card"><div class="sk" style="height:24px;width:60%"></div><div class="sk" style="height:14px;width:80%;margin-top:12px"></div></section>`;
          return;
        }
        if (BRIEF.empty) {
          el.innerHTML = `<section class="card"><h2 id="brief-page-title">아침 브리핑</h2><p class="empty">아직 올라온 브리핑이 없어요.<br />매일 아침 7시쯤 어제 장 정리가 올라와요.</p></section>`;
          return;
        }
        const b = BRIEF;
        const age = briefAge(b);
        el.innerHTML = `
          <section class="card">
            <p class="eyebrow">아침 브리핑 · ${esc(kDate(b.date))}${b.sample ? ' <span class="tag-sample">예시 데이터</span>' : ""}</p>
            <h2 id="brief-page-title" class="brief-head big">${esc(b.headline)}</h2>
            ${age ? `<p class="stale">${esc(age)}</p>` : ""}
          </section>
          ${themeSection(b.themes)}
          ${b.kr && !b.kr.closed ? flowDetail(b.kr.flows) : ""}
          ${marketSection(b.us, "미국 장", macroRow(b.us?.macro), !b.themes?.length)}
          ${b.usFlows ? `<section class="card"><h3>미국 자금 흐름</h3><p>${esc(b.usFlows)}</p></section>` : ""}
          ${marketSection(b.kr, "한국 장", b.kr?.fx ? macroRow([b.kr.fx]) : "", !b.themes?.length)}
          ${
            b.issues?.length
              ? `<section class="card"><h3>주요 이슈</h3><ol class="issues">${b.issues
                  .map((x) => `<li><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p></li>`)
                  .join("")}</ol></section>`
              : ""
          }
          ${
            b.dividend?.length
              ? `<section class="card"><h3>배당·가치주 체크</h3><ul class="dots">${b.dividend.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>`
              : ""
          }
          ${
            b.today?.length
              ? `<section class="card"><h3>오늘 볼 일정</h3><ul class="sched">${b.today
                  .map((x) => `<li>${x.time ? `<span class="t">${esc(x.time)}</span>` : ""}<span>${esc(x.title)}</span></li>`)
                  .join("")}</ul></section>`
              : ""
          }
          ${
            b.sources?.length
              ? `<section class="card"><h3>출처</h3><ul class="srcs">${b.sources
                  .map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`)
                  .join("")}</ul><p class="sub">숫자는 매일 아침 웹 검색으로 확인한 값이에요. 투자 추천이 아니에요.</p></section>`
              : ""
          }`;
      }
      $("#brief-card").addEventListener("click", (e) => {
        if (e.target.closest("#brief-open")) location.hash = "/briefing";
      });
      $("#brief-view").addEventListener("click", (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        if (t.id === "brief-back") {
          location.hash = shownKey ? encodeURIComponent(shownKey) : "";
          return;
        }
        if (t.dataset.go) {
          $("#q").value = t.textContent;
          syncClear();
          location.hash = encodeURIComponent(t.dataset.go);
        }
      });

      function showGate() {
        if ($("#gate")) return;
        document.querySelector("main").innerHTML = `<section class="card gate" id="gate"><h2>접근 코드를 입력해 주세요</h2>
    <p class="sub">이 판독기는 코드가 있는 사람만 쓸 수 있어요.</p>
    <form id="gate-form"><input id="code" type="password" style="text-transform:none" aria-label="접근 코드"><button type="submit">확인</button></form></section>`;
        $("#gate-form").addEventListener("submit", (e) => {
          e.preventDefault();
          try {
            localStorage.setItem("accessCode", $("#code").value);
          } catch {}
          location.reload();
        });
      }

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

      (async () => {
        try {
          config = await api("/api/config");
        } catch {}
        if (config.needsCode) {
          let c = "";
          try {
            c = localStorage.getItem("accessCode") || "";
          } catch {}
          if (!c) return showGate();
        }
        if (config.demo) {
          $("#demo").hidden = false;
          $("#demo").textContent =
            "데모 모드예요. 재무 지표는 2026년 10월 말 공개값이고, 주가·금리 곡선은 가상 경로예요.";
        }
        renderChips();
        loadMarket();
        loadTicker();
        loadBriefing();
        route(); // #종목코드 는 상세, #/board 는 판독표, #/briefing 은 아침 브리핑
      })();
    </script>
  </body>
</html>
