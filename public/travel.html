<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>여행 쇼핑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f4f6; --card: #ffffff; --fill: #f2f4f6; --ink: #191f28; --ink-2: #4e5968; --ink-3: #8b95a1;
        --line: #eef0f2; --primary: #3182f6; --good: #12a66d; --good-soft: #e3f6ee;
        --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #17171c; --card: #202027; --fill: #2c2c35; --ink: #ececef; --ink-2: #b0b8c1; --ink-3: #7e8590; --line: #2c2c35; --primary: #4593fc; --good: #2fc28a; --good-soft: #15302a; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; }
      body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); word-break: keep-all; overflow-wrap: anywhere; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
      .wrap { max-width: 640px; margin: 0 auto; }
      header { display: flex; align-items: center; gap: 6px; padding: calc(14px + env(safe-area-inset-top)) 0 6px; }
      header a { color: var(--ink-3); text-decoration: none; font-size: 26px; line-height: 1; padding: 4px 6px 4px 0; }
      header h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; flex: 1; }
      .card { background: var(--card); border-radius: 22px; padding: 20px; margin-top: 12px; }
      .hero small { display: block; font-size: 13px; color: var(--ink-3); font-weight: 600; }
      .hero .big { display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: var(--good); line-height: 1.25; margin-top: 2px; }
      .rate { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--ink-3); }
      .rate input { width: 72px; border: 0; background: var(--fill); color: var(--ink); border-radius: 10px; padding: 6px 8px; font: 700 15px var(--sans); text-align: right; }
      .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 14px -20px 0; padding: 0 20px 2px; }
      .chips::-webkit-scrollbar { display: none; }
      .chips button { flex: none; border: 0; border-radius: 999px; padding: 8px 13px; font: 600 14px var(--sans); background: var(--fill); color: var(--ink-2); cursor: pointer; }
      .chips button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
      .sortbar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
      .sortbar button { border: 0; background: none; color: var(--ink-2); font: 600 13px var(--sans); cursor: pointer; padding: 4px 0; }
      ul.items { list-style: none; margin: 4px 0 0; padding: 0; }
      .item { border-top: 1px solid var(--line); }
      .item:first-child { border-top: 0; }
      .item > button.row { all: unset; display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px 0; cursor: pointer; }
      .thumb { flex: none; width: 64px; height: 64px; border-radius: 14px; background: #fff; display: grid; place-items: center; overflow: hidden; font-size: 30px; border: 1px solid var(--line); }
      .thumb img { width: 100%; height: 100%; object-fit: contain; }
      .info { flex: 1; min-width: 0; }
      .name { font-size: 15px; font-weight: 700; line-height: 1.35; }
      .meta { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
      .meta b { color: var(--ink); font-weight: 700; }
      .save { flex: none; text-align: right; }
      .save strong { display: block; font-size: 17px; font-weight: 800; color: var(--good); white-space: nowrap; }
      .save span { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
      .save.none span { font-size: 12px; }
      .item.done .name { color: var(--ink-3); text-decoration: line-through; }
      .more { padding: 0 0 14px 76px; font-size: 13px; color: var(--ink-2); }
      .stores { display: flex; flex-wrap: wrap; gap: 6px; }
      .stores span { background: var(--fill); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
      .stores span:first-child { background: var(--good-soft); color: var(--good); }
      .more p { margin: 8px 0 0; }
      .more .links { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
      .more .links a { color: var(--ink-3); }
      .more .acts { display: flex; gap: 8px; margin-top: 10px; }
      .more .acts button, .more .acts a { border: 0; border-radius: 10px; padding: 7px 12px; font: 600 13px var(--sans); background: var(--fill); color: var(--ink); text-decoration: none; cursor: pointer; }
      details.tips summary { font-size: 16px; font-weight: 800; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
      details.tips summary::-webkit-details-marker { display: none; }
      details.tips summary::after { content: "›"; color: var(--ink-3); transform: rotate(90deg); }
      .tip { padding: 12px 0 0; }
      .tip b { font-size: 14px; }
      .tip p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
      .tip a { font-size: 12px; color: var(--ink-3); }
      .sec-t { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
      .sec-s { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
      .picks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
      .pick { display: flex; gap: 12px; align-items: center; background: var(--fill); border-radius: 14px; padding: 12px 14px; }
      .pick .ic { font-size: 24px; flex: none; }
      .pick small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }
      .pick b { display: block; font-size: 15px; font-weight: 800; }
      .pick span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 1px; }
      details.cc { border-top: 1px solid var(--line); }
      details.cc:first-of-type { border-top: 0; }
      details.cc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 13px 0; cursor: pointer; }
      details.cc summary::-webkit-details-marker { display: none; }
      details.cc summary b { font-size: 15px; }
      details.cc summary em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
      details.cc dl { margin: 0 0 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
      details.cc dt { color: var(--ink-3); font-weight: 600; white-space: nowrap; }
      details.cc dd { margin: 0; color: var(--ink-2); }
      details.cc dd a { color: var(--ink-3); font-size: 12px; }
      .cardlist { margin-top: 14px; }
      .foot { font-size: 12px; color: var(--ink-3); margin: 14px 4px 0; }
      .empty { color: var(--ink-3); text-align: center; padding: 24px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header><a href="/" aria-label="홈으로 가기">‹</a><h1>여행 쇼핑 🇯🇵</h1></header>

      <section class="card hero">
        <small>일본에서 한 개씩만 사도 아끼는 돈</small>
        <strong class="big" id="total">–</strong>
        <div class="rate"><label for="rate">환율 100엔 =</label><input id="rate" type="number" inputmode="decimal" min="1" /><span>원 (직접 고쳐요)</span></div>
      </section>

      <section class="card" id="cardsec" hidden>
        <h2 class="sec-t">어떤 카드 쓸까요? 💳</h2>
        <p class="sec-s" id="cardsAsOf"></p>
        <ul class="picks" id="picks"></ul>
        <div class="cardlist" id="cardlist"></div>
        <details class="tips" style="margin-top:8px"><summary>카드 쓸 때 지킬 것 3가지</summary><div id="cardtips"></div></details>
      </section>

      <section class="card">
        <div class="chips" id="cats" role="group" aria-label="카테고리"></div>
        <div class="sortbar"><span id="count"></span><button type="button" id="sort"></button></div>
        <ul class="items" id="items"></ul>
      </section>

      <section class="card">
        <details class="tips"><summary>이득 지키는 법 4가지</summary><div id="tips"></div></details>
      </section>
      <p class="foot">가격은 2026년 11월 조사 기준이에요. 사진은 위키미디어 공용 또는 판매처 사진이에요. 품목을 누르면 출처가 보여요.</p>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
      };
      let data = null, cat = "all", open = null;
      let sortBySave = store.get("travel.sort.jp", true);
      let rate = Number(store.get("travel.rate.jp", 900)) || 900;
      let done = store.get("travel.done.jp", {});
      const won = (yen) => Math.round((yen * rate) / 100);
      const man = (v) => (Math.abs(v) >= 10000 ? `${(v / 10000).toFixed(Math.abs(v) >= 100000 ? 0 : 1).replace(/\.0$/, "")}만 원` : `${v.toLocaleString("ko-KR")}원`);
      const saving = (it) => (it.jp && it.kr ? it.kr - won(it.jp) : null);
      const icon = (c) => data.categories.find((x) => x.key === c)?.icon || "🛍️";
      const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "출처"; } };

      function row(it) {
        const sv = saving(it);
        const pct = sv !== null ? Math.round((sv / it.kr) * 100) : null;
        const id = `${it.cat}:${it.name}`;
        const thumb = it.img
          ? `<img src="${esc(it.img)}" alt="${esc(it.name)} 사진" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${icon(it.cat)}'))">`
          : icon(it.cat);
        const price = it.jp ? `<b>¥${it.jp.toLocaleString("ko-KR")}</b> · <span style="white-space:nowrap">약 ${man(won(it.jp))}</span>` : "가격 확인 중";
        const right =
          sv === null ? `<div class="save none"><span>한국 비교 없음</span></div>`
          : sv > 0 ? `<div class="save"><strong>−${man(sv)}</strong><span>${pct}% 절약</span></div>`
          : `<div class="save none"><span>한국과 비슷해요</span></div>`;
        const more = open === id ? `<div class="more">
            <div class="stores">${it.where.map((w) => `<span>${esc(w)}</span>`).join("")}</div>
            ${it.kr ? `<p>한국 ${esc(it.krText || man(it.kr))}</p>` : ""}${it.note ? `<p>${esc(it.note)}</p>` : ""}
            <div class="links">${[["일본 가격", it.jpSrc], ["한국 가격", it.krSrc], ["사진", it.imgSrc]].filter(([, u]) => u).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}: ${esc(host(u))}</a>`).join(" · ")}</div>
            <div class="acts"><button type="button" data-done="${esc(id)}">${done[id] ? "산 것 취소" : "샀어요"}</button><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(it.name + " " + (it.size || ""))}" target="_blank" rel="noopener">사진 더 보기</a></div>
          </div>` : "";
        return `<li class="item${done[id] ? " done" : ""}"><button type="button" class="row" data-id="${esc(id)}" aria-expanded="${open === id}">
          <span class="thumb">${thumb}</span>
          <span class="info"><div class="name">${esc(it.name)}</div><div class="meta">${esc(it.size || "")} · ${price}</div><div class="meta">${esc(it.where[0] || "")}</div></span>
          ${right}</button>${more}</li>`;
      }

      function render() {
        let list = data.items.map((it, i) => ({ ...it, i })).filter((it) => cat === "all" || it.cat === cat);
        if (sortBySave) list.sort((a, b) => (saving(b) ?? -1e12) - (saving(a) ?? -1e12) || a.i - b.i);
        $("#items").innerHTML = list.length ? list.map(row).join("") : `<li class="empty">품목이 없어요</li>`;
        $("#count").textContent = `${list.length}개 · 비교 ${list.filter((x) => saving(x) !== null).length}개`;
        $("#sort").textContent = sortBySave ? "절약 큰 순 ⇅" : "기본 순 ⇅";
        const total = data.items.reduce((s, it) => s + Math.max(0, saving(it) ?? 0), 0);
        $("#total").textContent = `약 ${man(total)}`;
      }

      async function init() {
        try { data = await (await fetch("/travel/japan.json")).json(); }
        catch { $("#items").innerHTML = `<li class="empty">리스트를 불러오지 못했어요</li>`; return; }
        $("#rate").value = rate;
        $("#cats").innerHTML = [{ key: "all", name: "전체", icon: "🇯🇵" }, ...data.categories]
          .map((c) => `<button type="button" data-cat="${esc(c.key)}" aria-pressed="${c.key === cat}">${c.icon} ${esc(c.name)}</button>`).join("");
        $("#tips").innerHTML = data.tips.map((t) => `<div class="tip"><b>${esc(t.title)}</b><p>${esc(t.body)}</p><a href="${esc(t.url)}" target="_blank" rel="noopener">출처: ${esc(host(t.url))}</a></div>`).join("");
        renderCards(data.cards);
        render();
      }

      function renderCards(c) {
        if (!c || !c.list?.length) return;
        $("#cardsAsOf").textContent = `${c.asOf.replace(/^(\d+)-(\d+)-(\d+)$/, (_, y, m, d) => `${+m}월 ${+d}일`)} 기준이에요. 혜택은 자주 바뀌니 떠나기 전에 카드사 앱에서 한 번 더 확인해요.`;
        $("#picks").innerHTML = (c.picks || []).map((p) => `<li class="pick"><span class="ic" aria-hidden="true">${esc(p.icon)}</span><div><small>${esc(p.use)}</small><b>${esc(p.card)}</b><span>${esc(p.why)}</span></div></li>`).join("");
        const rows = [["환전", "fx"], ["결제", "pay"], ["ATM", "atm"], ["혜택", "perk"], ["되팔기", "refund"]];
        $("#cardlist").innerHTML = c.list.map((k) => `<details class="cc"><summary><b>${esc(k.name)}</b><em>${esc(k.issuer)} · ${esc(k.type)} ›</em></summary><dl>
            ${rows.filter(([, f]) => k[f]).map(([t, f]) => `<dt>${t}</dt><dd>${esc(k[f])}</dd>`).join("")}
            <dt>출처</dt><dd>${[k.url, k.url2].filter(Boolean).map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join(" · ")}</dd>
          </dl></details>`).join("");
        $("#cardtips").innerHTML = (c.tips || []).map((t) => `<div class="tip"><b>${esc(t.title)}</b><p>${esc(t.body)}</p></div>`).join("");
        $("#cardsec").hidden = false;
      }
      $("#cats").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        cat = b.dataset.cat; open = null;
        document.querySelectorAll("#cats button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        render();
      });
      $("#sort").addEventListener("click", () => { sortBySave = !sortBySave; store.set("travel.sort.jp", sortBySave); render(); });
      $("#rate").addEventListener("input", (e) => { const v = Number(e.target.value); if (!(v > 0)) return; rate = v; store.set("travel.rate.jp", v); render(); });
      $("#items").addEventListener("click", (e) => {
        const d = e.target.closest("[data-done]");
        if (d) { const id = d.dataset.done; if (done[id]) delete done[id]; else done[id] = true; store.set("travel.done.jp", done); return render(); }
        const r = e.target.closest("button.row"); if (!r) return;
        open = open === r.dataset.id ? null : r.dataset.id; render();
      });
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
      init();
    </script>
  </body>
</html>
